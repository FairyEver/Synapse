[build]
  command = "pnpm website:build"
  publish = "website/.vitepress/dist"
  ignore = "git diff --quiet HEAD^ HEAD -- website/ netlify.toml package.json pnpm-lock.yaml pnpm-workspace.yaml"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
