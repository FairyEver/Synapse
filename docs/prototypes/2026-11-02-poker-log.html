<script>
(() => {
  'use strict';
  const $ = selector => document.querySelector(selector);
  const icon = id => `<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const fmt = value => value.toLocaleString('zh-CN');
  const players = [{id:'li',name:'李杨',seat:1,me:true},{id:'rao',name:'饶磊',seat:2},{id:'zhang',name:'张益豪',seat:3}];
  // Fees are illustrative, not quotes from the live game. Every successful paid
  // start is one Roll; a super choice is completion metadata, never a new debit.
  const bet = (player,label,amount,note='') => ({type:'bet',player,label,amount,note});
  const roll = (player,fee,kind='super',pending=false) => ({type:'roll',player,label:kind==='super'?'超级 Roll':'普通 Roll',amount:fee,kind,pending});
  const rounds = [
    {id:'preflop',name:'翻牌前',board:[],events:[bet('rao','小盲',5),bet('zhang','大盲',10),bet('li','跟注',10),roll('rao',27),roll('rao',53),bet('rao','加注',195,'本轮累计下注至 200'),roll('zhang',71),roll('zhang',141),roll('zhang',211),bet('zhang','跟注',190),roll('li',78),roll('li',154),bet('li','跟注',190)]},
    {id:'flop',name:'翻牌',board:['K♠','9♥','7♣'],events:[bet('rao','过牌',0),roll('zhang',430),bet('zhang','下注',300),roll('li',228),roll('li',299),bet('li','跟注',300),bet('rao','跟注',300)]},
    {id:'turn',name:'转牌',board:['K♠','9♥','7♣','2♦'],events:[bet('rao','过牌',0),roll('zhang',140,'normal'),roll('zhang',693,'super',true)]},
    {id:'river',name:'河牌',board:['K♠','9♥','7♣','2♦','J♣'],events:[bet('rao','过牌',0),bet('zhang','过牌',0),bet('li','过牌',0)]}
  ];
  let scenario='live',view='rounds';
  const visibleRounds = () => scenario==='empty' ? [] : rounds.slice(0,scenario==='settled'?4:3);
  function eventsFor(player,round) { return (round ? round.events : visibleRounds().flatMap(r=>r.events)).filter(e=>!player||e.player===player); }
  function stats(events) { return events.reduce((s,e)=>{if(e.type==='roll'){s.roll+=e.amount;s.count++;s[e.kind]++;s.diamonds+=e.kind==='super'?3:1;}else{s.bet+=e.amount;}return s;},{bet:0,roll:0,count:0,normal:0,super:0,diamonds:0}); }
  function compensation(id) {
    // All three sample players remain in the hand. Split each fee separately,
    // allocating odd chips by the fixed sample seat order, not after summing.
    return visibleRounds().flatMap(r=>r.events).filter(e=>e.type==='roll'&&e.player!==id).reduce((sum,e)=>{
      const recipients=players.filter(p=>p.id!==e.player), index=recipients.findIndex(p=>p.id===id);
      return sum+Math.floor(e.amount/recipients.length)+(index<e.amount%recipients.length?1:0);
    },0);
  }
  function cards(board) {return `<div class="board round-board" aria-label="${board.length?'公共牌 '+board.join('、'):'尚未发公共牌'}">${board.map(c=>`<span class="playing-card ${/[♥♦]/.test(c)?'red':''}">${c}</span>`).join('')}</div>`;}
  function playerName(p) {return `<span class="person-name">${p.name}${p.me?'<span class="you">你</span>':''}</span>`;}
  function actionList(events,includeNames=false) {
    return `<ol class="action-list">${events.map(e=>{
      const p=players.find(p=>p.id===e.player);
      const seq=visibleRounds().flatMap(r=>r.events).indexOf(e)+1;
      let note=e.note;
      if(e.type==='roll') note=`本手第 ${eventsFor(e.player).filter(a=>a.type==='roll'&&visibleRounds().flatMap(r=>r.events).indexOf(a)<=seq-1).length} 次 · ${e.pending&&scenario==='live'?'待选牌，费用已支付':'已完成'}${p.me?` · 消耗 ${e.kind==='super'?3:1} 钻石`:''}`;
      return `<li class="action-item"><span class="action-number num">${String(seq).padStart(2,'0')}</span><div class="action-main">${includeNames?`${p.name} · `:''}${e.label}${note?`<small>${note}</small>`:''}</div><span class="action-amount num">${e.amount?`${fmt(e.amount)} <small>${e.type==='roll'?'花费':'追加'}</small>`:'不追加'}</span></li>`;
    }).join('')}</ol>`;
  }
  function roundTable(r) {
    return `<table class="player-table" aria-label="${r.name}各玩家投入"><colgroup><col><col><col><col></colgroup><thead><tr><th scope="col">玩家</th><th scope="col">本轮下注</th><th scope="col">Roll 次数</th><th scope="col">Roll 花费</th></tr></thead><tbody>${players.map(p=>{
      const ev=eventsFor(p.id,r),s=stats(ev),key=`${r.id}-${p.id}`;
      return `<tr class="summary-row"><td><div class="player-cell"><button type="button" class="row-expander" data-expand="${key}" aria-expanded="false" aria-controls="detail-${key}" aria-label="查看${p.name}在${r.name}的逐笔动作">${icon('chevron')}<span class="avatar">${p.seat}</span>${playerName(p)}</button></div></td><td class="paid">${fmt(s.bet)}</td><td class="roll-count ${s.count?'':'count-zero'}">${s.count?`${s.count} 次`:'0 次'}</td><td class="${s.roll?'paid':'count-zero'}">${fmt(s.roll)}</td></tr><tr id="detail-${key}" hidden><td class="details-cell" colspan="4">${ev.length?actionList(ev):'<p class="muted">本轮尚未行动</p>'}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  function renderRounds() {
    if(scenario==='empty'){ $('#rounds-view').innerHTML=empty();return; }
    let pot=0;
    $('#rounds-view').innerHTML=`<div class="content-toolbar"><span>金额单位：筹码 · 下注含盲注</span><button type="button" class="text-button" id="collapse-all">收起全部轮次</button></div>`+visibleRounds().map(r=>{
      const s=stats(r.events),previous=pot;pot+=s.bet;
      const active=scenario==='live'&&r.id==='turn';
      return `<details class="round" id="round-${r.id}" open><summary>${icon('chevron').replace('class="icon"','class="icon round-chevron"')}<div class="round-label"><div class="round-title"><h2>${r.name}</h2>${active?'<span class="stage-badge">进行中</span>':''}</div><p class="round-subtitle">下注 <b class="num">${fmt(s.bet)}</b> · Roll <b class="num">${s.count} 次 / ${fmt(s.roll)}</b></p></div>${cards(r.board)}</summary>${roundTable(r)}<div class="round-footer"><span>底池 <span class="num">${fmt(previous)}</span> → <strong class="num">${fmt(pot)}</strong></span><span>${active?'张益豪待选牌':'本轮已结束'}</span></div><button type="button" class="timeline-toggle" data-timeline="${r.id}" aria-expanded="false" aria-controls="timeline-${r.id}">${icon('chevron')}查看本轮行动顺序 <span class="muted">${r.events.length} 笔</span></button><div class="timeline" id="timeline-${r.id}" hidden>${actionList(r.events,true)}</div></details>`;
    }).join('')+(scenario==='live'?`<div class="round is-future">${icon('clock').replace('class="icon"','class="icon future-icon"')}<div class="future-title"><h2>河牌</h2><p>尚未开始</p></div><span class="muted">未发牌</span></div>`:settlement());
  }
  function empty(){return `<div class="empty-state">${icon('list')}<h2>等待本手开始</h2><p>开始后，按轮次记录下注与 Roll。</p></div>`;}
  function settlement(){return `<section class="settlement"><h2>本手结算</h2><p>示例：李杨赢得底池，Roll 补偿单独到账。</p><div class="settlement-line"><span>赢得底池</span><strong class="num">+${fmt(stats(visibleRounds().flatMap(r=>r.events)).bet)}</strong></div></section>`;}
  function renderPlayers(){
    if(scenario==='empty'){$('#players-view').innerHTML=empty();return;}
    $('#players-view').innerHTML=`<div class="player-summary"><h2>本手累计</h2><p>包含所有已发生轮次，Roll 花费不计入下注。</p>${players.map(p=>{
      const s=stats(eventsFor(p.id)),received=compensation(p.id),net=(scenario==='settled'&&p.me?stats(visibleRounds().flatMap(r=>r.events)).bet:0)-s.bet-s.roll+(scenario==='settled'?received:0);
      return `<article class="player-ledger"><div class="ledger-heading"><div class="ledger-person"><span class="avatar">${p.seat}</span><h3>${playerName(p)}</h3></div><span class="ledger-status">${scenario==='settled'?(p.me?'赢得底池':'已结算'):(p.id==='zhang'?'超级 Roll 待选牌':'仍在本手')}</span></div><div class="ledger-metrics"><dl><dt>累计下注</dt><dd class="num">${fmt(s.bet)}</dd></dl><dl><dt>Roll 次数</dt><dd class="num">${s.count} <small>次</small></dd></dl><dl><dt>Roll 花费</dt><dd class="num">${fmt(s.roll)}</dd></dl></div><div class="ledger-foot"><span>普通 ${s.normal} 次 · 超级 ${s.super} 次${p.me?` · <span class="diamond" aria-hidden="true">◇</span> ${s.diamonds} 钻石`:''}</span><span>${scenario==='settled'?'已收补偿':'待收补偿'} <b class="num">${fmt(received)}</b></span></div>${scenario==='settled'?`<div class="ledger-foot"><span>本手净变化</span><b class="num">${net>0?'+':''}${fmt(net)}</b></div>`:''}<details class="player-breakdown"><summary>按轮次拆分</summary><table class="breakdown-table" aria-label="${p.name}各轮投入"><thead><tr><th scope="col">轮次</th><th scope="col">下注</th><th scope="col">Roll</th><th scope="col">花费</th></tr></thead><tbody>${visibleRounds().map(r=>{const t=stats(eventsFor(p.id,r));return `<tr><td>${r.name}</td><td>${fmt(t.bet)}</td><td>${t.count} 次</td><td>${fmt(t.roll)}</td></tr>`;}).join('')}</tbody></table></details></article>`;
    }).join('')}</div>`;
  }
  function render(){
    const total=stats(visibleRounds().flatMap(r=>r.events)),mine=stats(eventsFor('li')),received=compensation('li');
    const stack=scenario==='empty'?10000:10000-mine.bet-mine.roll+(scenario==='settled'?total.bet+received:0);
    $('#total-bet').textContent=fmt(total.bet);$('#total-roll').textContent=fmt(total.roll);$('#total-count').textContent=total.count;
    $('#scene-pot').textContent=fmt(total.bet);$('#my-stack').textContent=fmt(stack);$('#scene-stack').textContent=fmt(stack);
    $('#hand-state').innerHTML=scenario==='live'?'<span class="live-dot"></span>转牌进行中':scenario==='settled'?'已结算':'尚未开始';
    $('#scene-phase').textContent=`第 24 手 · ${scenario==='live'?'转牌':scenario==='settled'?'已结束':'等待开始'}`;
    $('#my-pending').innerHTML=`${scenario==='settled'?'已收补偿':'待收补偿'} <b class="num">${fmt(received)}</b>`;
    $('#summary-note').textContent=scenario==='settled'?'下注与 Roll 补偿均已结算。':'下注进入底池；Roll 费用单独补偿其他玩家。';
    renderRounds();renderPlayers();$('#panel-scroll').scrollTop=0;
  }
  function selectView(next,focus=false){
    view=next;document.querySelectorAll('[data-view]').forEach(b=>{const selected=b.dataset.view===view;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1;if(selected&&focus)b.focus();});
    $('#rounds-view').hidden=view!=='rounds';$('#players-view').hidden=view!=='players';$('#panel-scroll').scrollTop=0;
  }
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>selectView(b.dataset.view)));
  $('.view-tabs').addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();selectView(e.key==='Home'?'rounds':e.key==='End'?'players':view==='rounds'?'players':'rounds',true);}});
  $('#panel-scroll').addEventListener('click',e=>{
    const expander=e.target.closest('[data-expand]');if(expander){const row=$(`#detail-${expander.dataset.expand}`);row.hidden=!row.hidden;expander.setAttribute('aria-expanded',String(!row.hidden));}
    const timeline=e.target.closest('[data-timeline]');if(timeline){const target=$(`#timeline-${timeline.dataset.timeline}`);target.hidden=!target.hidden;timeline.setAttribute('aria-expanded',String(!target.hidden));}
    if(e.target.closest('#collapse-all')){const all=[...document.querySelectorAll('.round')].filter(r=>r.tagName==='DETAILS'),open=all.some(r=>r.open);all.forEach(r=>r.open=!open);e.target.closest('#collapse-all').textContent=open?'展开全部轮次':'收起全部轮次';}
  });
  $('#scenario').addEventListener('change',e=>{scenario=e.target.value;render();});
  $('#device').addEventListener('click',()=>{const narrow=$('#app').classList.toggle('narrow');$('#device').setAttribute('aria-pressed',String(narrow));$('#device span').textContent=narrow?'返回桌面':'窄屏预览';});
  function togglePanel(open){$('#log-panel').hidden=!open;$('#open-log').setAttribute('aria-expanded',String(open));$('#reopen').hidden=open;(open?$('#close-log'):$('#reopen')).focus();}
  $('#close-log').addEventListener('click',()=>togglePanel(false));$('#reopen').addEventListener('click',()=>togglePanel(true));$('#open-log').addEventListener('click',()=>togglePanel($('#log-panel').hidden));
  $('#log-panel').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();togglePanel(false);}});
  render();
})();
</script>
</body>
</html>
