<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>德州扑克 · 手牌与对局日志原型</title>
  <!-- The room toolbar, canvas, seat/chip markup and betting dock follow the Dashboard Table.
       The prototype adds a hand row and public event rail to that layout. -->
  <link rel="stylesheet" href="../../dashboard/src/game-center/styles/web.css">
  <link rel="stylesheet" href="../../dashboard/src/game-center/games/poker/styles/table-tokens.css">
  <link rel="stylesheet" href="../../dashboard/src/game-center/games/poker/styles/responsive-controls.css">
  <link rel="stylesheet" href="../../dashboard/src/game-center/games/poker/styles/adaptive-table.css">
  <link rel="stylesheet" href="../../dashboard/src/game-center/games/poker/styles/chips.css">
  <style>
    :root {
      /* HeroUI light tokens as computed on the current Web game. */
      --background: lab(96.5432% 0 0);
      --surface: lab(100% 0 0);
      --surface-secondary: lab(94.4672% .129223 -.473213);
      --foreground: lab(8.34178% .607349 -2.12998);
      --muted: lab(47.8738% 1.41454 -4.98644);
      --border: lab(88.3653% .399351 -1.45447);
      --separator: lab(90.6853% .399232 -1.45452);
      --default: lab(93.0314% .0993609 -.364041);
      --accent: lab(54.5335% 3.31545 -66.5298);
      --accent-foreground: lab(98.9676% 0 0);
      --accent-soft: color-mix(in oklab, var(--accent) 15%, transparent);
      --accent-soft-foreground: color-mix(in oklab, var(--accent) 70%, var(--foreground));
      --success: lab(71.4376% -59.4106 38.0321);
      --danger: oklch(.52 .19 25.74);
      --destructive: var(--danger);
      --radius: .5rem;
      --card-paper: oklch(.965 .015 83);
      --shadow: color-mix(in oklab, var(--foreground) 13%, transparent);
      --system-font: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-family: var(--system-font);
      font-variant-numeric: tabular-nums;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground); background: var(--background); }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }
    img { display: block; user-select: none; }
    p, h1, h2 { margin: 0; }
    svg { width: 18px; height: 18px; flex: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .font-sans { font-family: var(--system-font); }
    .bg-surface { background: var(--surface); }
    .text-foreground { color: var(--foreground); }
    .text-muted { color: var(--muted); }
    .text-sm { font-size: .875rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: .5rem; }

    .button, select {
      display: inline-flex; align-items: center; justify-content: center; gap: .375rem; min-height: 2.25rem; padding: 0 .875rem;
      border: 0; border-radius: 99px; background: var(--default); color: var(--foreground); white-space: nowrap; text-decoration: none; font-size: .875rem; font-weight: 500;
    }
    .button:hover:not(:disabled) { background: color-mix(in oklab, var(--default) 94%, var(--foreground)); }
    .button svg { width: 1rem; height: 1rem; }
    .button.primary { background: var(--accent); color: var(--accent-foreground); font-weight: 650; }
    .button.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 89%, var(--accent-foreground)); }
    .button.quiet { background: transparent; }
    .button.icon { width: 2.25rem; min-width: 2.25rem; padding: 0; }
    .button.small { min-height: 2rem; padding: 0 .75rem; font-size: .8125rem; }
    .button[aria-pressed="true"] { color: var(--accent-soft-foreground); background: var(--accent-soft); }
    .poker-edge-controls { border-bottom: 1px solid var(--separator); }
    .poker-edge-controls svg { flex: none; }

    /* The regular canvas, room toolbar and action buttons retain the production layout. */
    .poker-table[data-control-layout] { height: 100dvh; }
    .poker-table[data-control-layout] .poker-table-layout {
      grid-template-columns: minmax(0, 1fr) 3.75rem;
      grid-template-rows: 3.5rem minmax(0, 1fr) auto;
    }
    .poker-table[data-control-layout] .poker-edge-controls,
    .poker-table[data-control-layout] .poker-controls-anchor { grid-column: 1 / -1; }
    .poker-table[data-control-layout] .poker-table-main { grid-area: 2 / 1; }
    .poker-table[data-control-layout] .poker-controls-anchor { padding-bottom: .875rem; }
    .poker-table[data-control-layout][data-compact-controls="true"] .poker-table-layout {
      grid-template-rows: 5.5rem minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr) 2.75rem;
    }
    .poker-canvas-viewport { flex: 1; }
    .poker-bet-presets > .button { margin: 0; }
    .poker-action-dock > .button { width: 100%; }
    .poker-pot-row .poker-pot-extra { font-size: var(--scene-label); line-height: 1.2; }
    .poker-pot-row .poker-pot-extra .poker-pot { font-size: 42px; }
    .poker-seat-objects[data-dock-holes="true"] { min-height: 78px; }
    .poker-turn-ring { width: 100%; height: 100%; }
    #results .poker-settlement { display: flex; flex-wrap: wrap; text-align: center; }
    #results .poker-settlement strong { max-width: none; }

    .hand-dock {
      display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: .75rem;
      width: min(100%, 49rem); margin: 0 auto .35rem;
    }
    .dock-label { display: flex; align-items: center; gap: 6px; min-height: 20px; color: var(--muted); font-size: .6875rem; white-space: nowrap; }
    .dock-label strong { color: var(--foreground); font-size: .8125rem; font-weight: 650; }
    .own { display: grid; gap: 4px; padding-bottom: 3px; }
    .own-cards { display: flex; gap: 4px; }
    .own-cards .playing { width: 42px; }
    .shield { display: inline-flex; color: var(--accent); }
    .shield svg { width: 15px; height: 15px; }
    .hand { min-width: 0; }
    .hand-title { justify-content: center; }
    .hand-title .button { min-height: 24px; width: 24px; min-width: 24px; }
    .fan { min-width: 0; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }
    .fan-inner { display: flex; align-items: center; width: max-content; min-width: 100%; justify-content: center; min-height: 98px; padding: 9px 7px 6px; }
    .ability {
      position: relative; flex: 0 0 auto; display: grid; gap: 3px; justify-items: center; width: clamp(58px, 6.3vw, 78px);
      padding: 4px 4px 5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card-paper);
      color: var(--foreground); box-shadow: 0 2px 5px var(--shadow); transition: transform 150ms ease-out;
    }
    .ability + .ability { margin-left: -6px; }
    .ability img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 5px; }
    .ability-name { white-space: nowrap; font-size: .625rem; font-weight: 650; }
    .ability .price {
      position: absolute; top: -5px; left: -5px; display: grid; place-items: center; min-width: 22px; padding: 0 4px; height: 21px;
      border: 2px solid var(--surface); border-radius: 99px; background: var(--accent); color: var(--accent-foreground); font-size: .625rem; font-weight: 750;
    }
    .ability[aria-pressed="true"] { z-index: 2; border-color: var(--accent); }
    .ability[aria-pressed="true"], .ability:focus-visible { transform: translateY(-4px); z-index: 3; }
    .ability.unavailable .price { background: var(--muted); }
    .fan-inner > :first-child:nth-last-child(n+4), .fan-inner > :nth-child(2):nth-last-child(n+3) { rotate: -4deg; }
    .fan-inner > :last-child:nth-child(n+4), .fan-inner > :nth-last-child(2):nth-child(n+3) { rotate: 4deg; }
    @media (hover: hover) { .ability:hover { transform: translateY(-4px); z-index: 3; } }
    .empty-hand { color: var(--muted); font-size: .75rem; }

    .rail { grid-area: 2 / 2; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); justify-items: center; align-content: start; gap: 8px; padding: 13px 4px 5px; border-left: 1px solid var(--separator); }
    #rail-icon { color: var(--muted); }
    .log-list { width: 100%; overflow-y: auto; scrollbar-width: thin; display: grid; align-content: start; justify-items: center; gap: 5px; padding: 4px 3px; }
    .log-entry {
      width: 36px; height: 36px; display: grid; place-items: center; padding: 0; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted); background: var(--surface);
    }
    .log-entry img { width: 100%; height: 100%; object-fit: cover; }
    .log-entry[data-active="true"] { border-color: var(--accent); color: var(--accent); }
    .prototype-overlay { grid-area: 2 / 1; position: relative; z-index: 5; min-height: 0; pointer-events: none; }
    .log-tip, .detail, .web-popover {
      position: absolute; background: var(--surface); border: 1px solid var(--separator);
      border-radius: calc(var(--radius) * 1.5); box-shadow: 0 6px 18px var(--shadow);
    }
    .log-tip {
      z-index: 2; inset: .5rem .375rem auto auto; width: min(275px, calc(100% - 14px));
      display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 10px;
      max-height: min(125px, 37%); overflow: auto; padding: 10px; font-size: .75rem; line-height: 1.45;
    }
    .log-tip img { width: 47px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; }
    .log-tip > svg { color: var(--accent); }
    .log-tip strong { display: block; font-size: .875rem; }
    .log-tip p { margin-top: 3px; color: var(--muted); }
    .log-tip .log-result { color: var(--foreground); }
    .detail {
      z-index: 1; inset: auto 0 .5rem; margin-inline: auto; width: min(580px, calc(100% - 24px));
      max-height: min(230px, calc(63% - 16px)); overflow-y: auto; padding: 12px 14px; pointer-events: auto;
    }
    .detail-heading { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 11px; align-items: start; }
    .detail-heading img { width: 44px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; }
    .detail h2, .web-popover h2 { font-size: 1rem; font-weight: 650; }
    .detail p { margin-top: 4px; font-size: .75rem; color: var(--muted); line-height: 1.45; }
    .detail p.error { color: var(--danger); }
    .targets, .candidates { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .candidate[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .playing { aspect-ratio: 5 / 7; width: 42px; height: auto; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); object-fit: contain; }
    .targets .playing { width: 20px; }
    .detail-footer { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 8px; }
    .detail-footer > span { color: var(--muted); font-size: .75rem; }
    .detail-footer strong { color: var(--foreground); }
    .candidates { display: grid; grid-template-columns: repeat(5, minmax(0, 43px)); }
    .candidate { min-width: 0; padding: 2px; border: 1px solid transparent; border-radius: 7px; background: var(--background); }
    .candidate .playing { width: 100%; }
    .intel-cards { display: flex; gap: 4px; margin-top: 7px; }
    .intel-cards .playing { width: 36px; }

    .web-popover {
      position: fixed; inset: auto; z-index: 9; max-width: calc(100vw - 1rem); max-height: min(55dvh, 30rem);
      width: min(23rem, calc(100vw - 1rem)); margin: 0; padding: 1rem; color: var(--foreground); overflow: auto; font: .875rem var(--system-font);
    }
    .web-popover header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: .5rem; }
    .web-popover ul, .web-popover ol { padding-left: 1.25rem; }
    .web-popover li + li { margin-top: .375rem; }
    .web-popover form { display: flex; align-items: center; flex-wrap: wrap; gap: .625rem; }
    .web-popover input[type="number"] { width: 6rem; border: 1px solid var(--border); border-radius: var(--radius); padding: .45rem; }
    .web-popover input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .web-popover .menu-group { display: flex; gap: .5rem; align-items: center; }
    .web-popover .panel-tabs { display: flex; gap: .375rem; margin-bottom: .5rem; }
    .web-popover .panel-tabs button { flex: 1; }

    [data-compact-controls="true"] .poker-edge-controls .button { width: 2.25rem; min-width: 2.25rem; padding: 0; }
    [data-compact-controls="true"] .toolbar-label { display: none; }
    @media (max-width: 620px) {
      .poker-table[data-control-layout] .poker-controls-anchor { padding-inline: .55rem; padding-bottom: .55rem; }
      .poker-table[data-control-layout] .poker-bet-presets { gap: .25rem; }
      .poker-table[data-control-layout] .poker-action-buttons .poker-button { min-width: 0; padding-inline: .25rem; }
      .check-detail { display: none; }
      .hand-dock { gap: .5rem; }
      .own-cards { gap: 3px; }
      .own-cards .playing { width: 32px; }
      .hand-title { justify-content: start; padding-left: 4px; }
      .fan-inner { justify-content: start; min-height: 84px; gap: 4px; }
      .ability + .ability { margin-left: 0; }
      .rail { padding: 9px 2px 4px; gap: 4px; }
      .log-entry { width: 32px; height: 32px; }
      .detail { width: calc(100% - 12px); padding: 8px 9px; max-height: min(193px, calc(100% - 88px)); }
      .detail-heading { gap: 7px; }
      .detail-heading img { width: 36px; }
      .detail-heading .button { width: 30px; min-width: 30px; min-height: 30px; }
      .detail-footer { margin-top: 6px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="poker-table poker-immersive" data-control-layout="bottom" data-compact-controls="false" aria-label="牌桌 4821">
    <div class="poker-table-layout">
      <header class="poker-edge-controls bg-surface font-sans text-foreground">
        <a class="button" href="https://synapse.d2.pub/game/poker" aria-label="返回房间">
          <span data-symbol="back" aria-hidden="true"></span><span class="toolbar-label">返回房间</span>
        </a>
        <div class="poker-room-details">
          <span class="poker-room-summary text-sm"><strong>#4821</strong><span class="text-muted">第 1 手 · 陪练</span></span>
          <div class="poker-room-rules text-sm"><span>标准 52 张</span><span>盲注 5 / 10</span></div>
        </div>
        <div class="poker-perspective flex items-center gap-2">
          <button type="button" class="button" aria-label="成员管理" data-system="members"><span data-symbol="members"></span><span class="toolbar-label">成员</span></button>
          <button type="button" class="button" aria-label="对局信息" data-system="match"><span data-symbol="log"></span><span class="toolbar-label">对局信息</span></button>
          <button type="button" class="button" aria-label="牌型大小" data-system="ranks"><span data-symbol="ranks"></span><span class="toolbar-label">牌型大小</span></button>
          <button type="button" class="button icon" aria-label="更多牌桌操作" data-system="menu"><span data-symbol="more"></span></button>
        </div>
      </header>

      <div class="poker-table-main">
        <div id="results" class="poker-results-anchor" hidden></div>
        <div class="poker-canvas-viewport">
          <div class="poker-canvas" data-table-shape="landscape">
            <div class="poker-rail" aria-hidden="true"><div class="poker-felt"></div></div>
            <div class="poker-table-content">
              <div class="poker-center">
                <div id="pools" class="poker-pot-row"></div>
                <div id="board" class="poker-board" data-card-size="md" aria-label="公共牌"></div>
                <div class="poker-board-caption"><span id="street" class="poker-street"></span></div>
              </div>
              <div id="seats"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="prototype-overlay font-sans">
        <section id="detail" class="detail" aria-labelledby="detail-title" hidden></section>
        <div id="log-tip" class="log-tip" hidden></div>
      </div>
      <aside class="rail font-sans" aria-label="对局日志">
        <span id="rail-icon" data-symbol="log" aria-hidden="true"></span>
        <div id="log" class="log-list"></div>
      </aside>

      <footer class="poker-controls-anchor" aria-label="你的手牌和操作">
        <div class="hand-dock font-sans">
          <section class="own" aria-label="你的底牌">
            <div class="dock-label"><strong>你的底牌</strong><span id="shield" class="shield" hidden></span></div>
            <div class="own-cards" id="holes"></div>
          </section>
          <section class="hand" aria-label="你的能力牌">
            <div class="dock-label hand-title"><strong>能力牌</strong><span id="hand-count"></span><button class="button icon quiet" type="button" id="intel" aria-label="私密情报" title="私密情报" hidden></button></div>
            <div class="fan" id="fan"><div class="fan-inner" id="hand"></div></div>
          </section>
        </div>
        <div id="controls" class="poker-human-controls" aria-label="本人牌桌操作">
          <div class="poker-control-state"><span class="poker-action-indicator" aria-hidden="true"></span><span id="turn" role="status"></span><span id="clock" class="poker-action-clock" aria-label="行动剩余时间"></span></div>
          <section id="actions" class="poker-action-dock" aria-label="下注操作"></section>
        </div>
      </footer>
    </div>
  </main>
  <dialog id="system-panel" class="web-popover" aria-labelledby="system-title"></dialog>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

  <script id="poker-model">
const Poker = (() => {
  const cards = {
    single: { name: '换牌术', art: '01', description: '指定一张底牌，从牌堆随机抽一张替换。', target: 'hole', draws: 1, price: 'normal', weight: 2 },
    three: { name: '左右逢源', art: '06', description: '指定一张底牌，从三张随机候选中选一张替换。', target: 'hole', draws: 3, price: 'super', weight: 2 },
    five: { name: '五选其一', art: '07', description: '随机锁定一张底牌，从五张随机候选中选一张替换。', draws: 5, price: 'super', weight: 3 },
    double: { name: '重整旗鼓', art: '02', description: '随机抽两张新牌，替换你的两张底牌。', draws: 2, price: 'normal', weight: 4 },
    preview: { name: '先知之眼', art: '11', description: '私下查看下一张公共牌。牌序改变后情报失效。' },
    inspect: { name: '明察秋毫', art: '14', description: '私下查看一名未弃牌对手的两张底牌。', target: 'seat' },
    draw: { name: '灵感迸发', art: '22', description: '从共享牌池抽两张能力牌。' },
    counter: { name: '反制咒', art: '48', description: '阻止下一张以你为唯一目标的敌对能力牌。' },
  };
  const streets = { flop: '翻牌', turn: '转牌', river: '河牌' };
  const ranks = '23456789TJQKA';
  const fullDeck = Array.from(ranks).flatMap(rank => Array.from('cdhs', suit => rank + suit));
  const streetOrder = Object.keys(streets);

  function addLog(state, action, seat, data = {}) {
    const actor = seat == null ? '' : state.seats[seat].name;
    const entry = { id: ++state.seq, street: state.street, actor, action, ...data };
    state.log.unshift(entry);
    return entry;
  }

  function dealAbility(state, count) {
    const received = state.abilityPool.splice(0, count);
    for (const key of received) state.hand.push({ key, id: ++state.serial });
    return received.length;
  }

  function reset(key) {
    const split = key === 'split';
    const river = key === 'river' || split;
    const board = split ? ['2c', '3d', '4h', '5s', 'Kc'] :
      ['Qh', '9s', '4c', ...(river ? ['2d', '8h'] : [])];
    const seats = [
      { name: '你', avatar: '你', stack: key === 'low' ? 1 : 360, total: split ? 150 : 60, holes: split ? ['As', '9d'] : ['Ah', 'Jc'] },
      { name: '阿岚', avatar: '岚', stack: split ? 0 : 480, total: split ? 100 : 60, holes: split ? ['Ad', '8d'] : ['Ks', 'Td'] },
      { name: '小舟', avatar: '舟', stack: 410, total: split ? 150 : 60, holes: split ? ['Qc', 'Jh'] : ['9h', '9d'] },
    ];
    if (!split) seats.push({ name: '林间', avatar: '林', stack: 520, total: 60, holes: ['Ac', '7c'] });
    for (const seat of seats) Object.assign(seat, { streetBet: 0, cardPaid: 0, folded: false, action: '' });
    const burned = river ? ['3s', '5c', '6h'] : ['3s'];
    const scheduled = river ? [] : ['5c', '2d', '6h', '8h'];
    const reserved = new Set([...board, ...burned, ...scheduled, ...seats.flatMap(seat => seat.holes)]);
    const state = {
      street: river ? 'river' : 'flop', seats, board, burned,
      deck: [...scheduled, ...fullDeck.filter(card => !reserved.has(card))], rng: 6841,
      phase: key === 'waiting' ? 'opponents' : 'active', opponentMode: 'opening',
      log: [], seq: 0, hand: [], serial: 0, pending: null, intel: [],
      abilityPool: [...Object.keys(cards), 'inspect', 'counter', 'three', 'single', 'double', 'preview', 'five', 'draw'],
      cardFees: split ? 25 : 0, exchanges: 0, minRaise: 10, shield: false, results: null,
    };
    dealAbility(state, Object.keys(cards).length);
    addLog(state, 'raise', 1, { amount: 30, street: 'preflop' });
    addLog(state, 'call', seats.length - 1, { amount: 30, street: 'preflop' });
    addLog(state, 'street', null, { street: state.street });
    if (key === 'waiting') commitBet(state, 2, 'bet', 20);
    if (split) {
      seats[2].cardPaid = 25;
      addLog(state, 'allin', 1, { amount: 100 });

    members: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-4M16 3a4 4 0 0 1 0 8"/><circle cx="9" cy="7" r="4"/>',
    ranks: '<path d="M12 21c-2-2-5-3-10-3V3c5 0 8 1 10 3 2-2 5-3 10-3v15c-5 0-8 1-10 3Zm0-15v15"/>',
    more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    up: '<path d="m6 15 6-6 6 6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    eye: '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/>',
    shield: '<path d="m12 3 8 3v5c0 5-8 10-8 10s-8-5-8-10V6zM8 12l3 3 5-6"/>',
    fold: '<path d="m6 6 12 12M6 18 18 6"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    call: '<path d="M4 12h15m-5-5 5 5-5 5"/>',
    bet: '<circle cx="12" cy="12" r="8"/><path d="M12 8v8m-4-4h8"/>',
    raise: '<path d="M12 19V5m-5 5 5-5 5 5"/>',
    allin: '<path d="m5 16 7-7 7 7M5 11l7-7 7 7"/>',
    street: '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="m12 8 3 4-3 4-3-4Z"/>',
    settle: '<path d="M8 3h8v7a4 4 0 0 1-8 0zM8 6H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v6m-4 1h8"/>',
  };
  const icon = name => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + symbols[name] + '</svg>';
  const faceName = card => (card[0] === 'T' ? '10' : card[0]) + suits[card[1]];
  const face = (card, privateFace = false) => '<img class="playing" src="' + assets + 'cards/' + card + '.svg" alt="' + faceName(card) + '" draggable="false"' + (privateFace ? ' data-private' : '') + '>';
  const artwork = (key, alt = '') => '<img src="' + assets + 'ability-cards/v1/' + cards[key].art + '.png" alt="' + alt + '" draggable="false">';
  const scenarioNames = { flop: '常规行动', waiting: '等待对手', river: '河牌换牌', low: '筹码不足', split: '平分与边池' };
  const seatNumbers = [1, 2, 4, 5];
  let scenario = 'flop';
  let chosenBet = null;
  let matchTab = '日志';
  let state;
  let selection;
  let showIntel;
  let error;
  let pinnedLog;
  let hoveredLog;
  let focusedLog;

  function announce(message) {
    $('#announcer').textContent = message;
  }

  function focusAt(key) {
    const button = document.querySelector('[data-focus="' + CSS.escape(key) + '"]');
    if (button && !button.disabled) button.focus({ preventScroll: true });
  }

  function button(text, attrs = '', variant = '') {
    return '<button type="button" class="button ' + variant + '" ' + attrs + '>' + text + '</button>';
  }

  function logHeading(entry) {
    if (entry.card) return cards[entry.card].name;
    if (entry.action === 'street') return streets[entry.street];
    return labels[entry.action];
  }

  function poolName(pool, index) {
    if (pool.refund) return '未跟注返还';
    if (index === 0) return '主池';
    return index === 1 ? '边池' : '边池 ' + index;
  }

  function tableCard(card, faceUp = true) {
    if (faceUp && !card) return '<span class="poker-card-placeholder" aria-label="未发牌"></span>';
    const visible = faceUp ? card : null;
    return '<span class="poker-card" data-face="' + (visible ? 'up' : 'down') + '" role="img" aria-label="' +
      (visible ? faceName(visible) : '牌背') + '"><span class="poker-card-turn"><span class="poker-card-front" aria-hidden="true">' +
      (visible ? '<img src="' + assets + 'cards/' + visible + '.svg" alt="" width="240" height="336" draggable="false">' : '') +
      '</span><span class="poker-card-back" aria-hidden="true"><span>♠</span></span></span></span>';
  }

  // Mirrors the PokerChip and PokerChipPile markup, using the shared denomination layout.
  const edgePath = Array.from({ length: 8 }, (_, i) => {
    const angle = i * Math.PI / 4;
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    return [[28, 3], [36, 3], [35, 12], [29, 12]].map(([x, y], index) =>
      (index ? 'L' : 'M') + (32 + (x - 32) * c - (y - 32) * s).toFixed(3) + ' ' +
      (32 + (x - 32) * s + (y - 32) * c).toFixed(3)).join('') + 'Z';
  }).join('');

  function chipPile(chips, label, seed = 0, bank = false) {
    const layout = chipDisplay.layoutChipPile(chips, seed);
    return '<span class="poker-chip-pile' + (bank ? ' poker-seat-bank' : '') + '" role="img" aria-label="' + label + '">' +
      layout.chips.map(chip => '<span class="poker-placed-chip" style="--chip-x:' + chip.x + ';--chip-y:' + chip.y +
        ';--chip-turn:' + chip.rotation + 'deg;z-index:' + chip.depth + '"><span class="poker-chip" data-chip-value="' +
        chip.value + '" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" class="poker-chip-disc"/>' +
        '<path d="' + edgePath + '" class="poker-chip-edge"/><circle cx="32" cy="32" r="23" class="poker-chip-ring"/>' +
        '<circle cx="32" cy="32" r="20" class="poker-chip-dots"/><text x="32" y="33" text-anchor="middle" dominant-baseline="middle">' +
        (chip.value === 1000 ? '1k' : chip.value) + '</text></svg></span></span>').join('') + '</span>';
  }

  function activeSeat() {
    if (state.phase === 'active') return 0;
    if (state.phase === 'opponents') return state.seats.findIndex((seat, i) => i > 0 && !seat.folded && seat.stack);
    return -1;
  }

  function renderTable() {
    const settled = state.phase === 'settled';
    const showdown = settled && state.seats.filter(seat => !seat.folded).length > 1;
    const actor = activeSeat();
    const maxSeats = 6;
    $('#seats').innerHTML = Array.from({ length: maxSeats }, (_, seatNo) => {
      // Six available seats, using seatPosition from the Dashboard view contract.
      const position = Math.round(seatNo * 10 / maxSeats) % 10;
      const number = seatNo + 1;
      const i = seatNumbers.indexOf(number);
      const seat = state.seats[i];
      if (!seat) return '<div class="poker-seat poker-seat-empty" data-position="' + position +
        '" role="group" aria-label="座位 ' + number + ' · 空位"><span class="poker-empty-marker" aria-hidden="true">' +
        number + '</span><span>空位</span></div>';
      const mine = i === 0;
      const acting = i === actor;
      const revealed = showdown && !seat.folded;
      const status = seat.folded ? '已弃牌' : acting ? (mine ? '轮到你' : '行动中') :
        !seat.stack && !settled ? '已全下' : labels[seat.action] || (mine ? '本人操作' : '机器人');
      const win = settled && state.results.some(pool => !pool.refund && pool.winners.includes(i));
      const clock = '<svg class="poker-turn-ring" viewBox="0 0 40 40" aria-hidden="true">' +
        '<circle class="poker-turn-track" cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="18" pathLength="100" stroke-dasharray="100" stroke-dashoffset="50"/></svg>';
      return '<div class="poker-seat" role="group" data-position="' + position + '" data-acting="' + acting +
        '" data-folded="' + seat.folded + '" data-mine="' + mine + '" data-winner="' + win + '" aria-label="座位 ' + number + ' · ' + seat.name +
        '"><div class="poker-seat-objects" data-dock-holes="' + mine + '">' + (mine ? '' :
        '<div class="poker-seat-cards" data-card-size="' + (seat.folded ? 'xs' : 'sm') + '" data-dealt="true">' +
        seat.holes.map(card => tableCard(card, revealed)).join('') + '</div>') +
        chipPile(chipDisplay.chipBreakdown(seat.stack), seat.name + '剩余筹码 ' + num(seat.stack), number, true) +
        '</div><div class="poker-seat-plate"><span class="poker-seat-avatar">' + number + (acting ? clock : '') +
        '</span><span class="poker-seat-identity"><span class="poker-seat-name">' + seat.name +
        '</span><span class="poker-stack">' + num(seat.stack) + '</span></span>' +
        (mine ? '<span class="poker-dealer" role="img" aria-label="按钮位">D</span>' : '') +
        '</div><div class="poker-seat-meta"><span class="poker-ai-state" data-acting="' + acting + '">' + status + '</span>' +
        '<span class="poker-wager" data-visible="' + Boolean(!settled && seat.streetBet) +
        '" aria-label="' + seat.name + '本轮下注 ' + num(seat.streetBet) + '">' + icon('chips') +
        '<span>' + num(seat.streetBet) + '</span></span></div>' +
        '<button type="button" class="poker-seat-info-trigger" data-system="seat" data-seat-info="' + i + '" aria-label="查看' +
        seat.name + '的玩家信息"></button></div>';
    }).join('');

    const pools = state.results ?? pots(state);
    const main = pools.find(pool => !pool.refund)?.amount ?? 0;
    const other = pools.filter(pool => !pool.refund).slice(1).reduce((sum, pool) => sum + pool.amount, 0);
    const hasAllIn = state.seats.some(seat => !seat.folded && !seat.stack);
    // The canvas's one visible pile includes live wagers; side pools are broken out at settlement.
    const displayed = settled ? main : state.seats.reduce((sum, seat) => sum + seat.total, state.cardFees);
    const chips = chipDisplay.addChipPayment(chipDisplay.chipBreakdown(displayed - state.cardFees), state.cardFees);
    $('#pools').innerHTML = '<button type="button" class="poker-pot-value poker-pot-sources-trigger" data-system="pot" aria-label="查看底池来源">' +
      '<span class="poker-pot-label">底池</span><span class="poker-pot" id="main-pool">' + num(displayed) + '</span>' +
      chipPile(chips, '底池 ' + num(displayed)) + '</button>' + (other && (hasAllIn || settled) ?
      '<span class="poker-pot-extra">' + (settled ? '边池 ' : '含边池 ') + num(other) + '</span>' : '');
    $('#board').innerHTML = Array.from({ length: 5 }, (_, i) =>
      '<span class="poker-deal-slot" data-dealt="true">' + tableCard(state.board[i]) + '</span>').join('');
    $('#street').textContent = settled ? '已结算' : streets[state.street];
    $('#results').hidden = !settled;
    if (settled) $('#results').innerHTML = '<div class="poker-settlement">' + pools.map((pool, i) => {
      const shares = pool.winners.map(winner => state.seats[winner].name + ' +' + num(pool.shares[winner])).join('、');
      return '<span><strong>' + poolName(pool, i) + ' ' + num(pool.amount) + '</strong> · ' + shares + '</span>';
    }).join('') + '</div>';
  }

  function fitCanvas() {
    const viewport = $('.poker-canvas-viewport');
    const canvas = $('.poker-canvas');
    const { width, height } = viewport.getBoundingClientRect();
    const { scene, scale } = tableScene.fitTableScene(width, height);
    canvas.dataset.tableShape = scene.mode;
    canvas.dataset.compact = String(scale < .65);
    Object.assign(canvas.style, {
      width: scene.width + 'px', height: scene.height + 'px',
      transform: 'translate(-50%, -50%) scale(' + scale + ')',
    });
    canvas.style.setProperty('--poker-scale', scale || 1);
    for (const [name, value] of Object.entries(tableScene.tableSceneVariables(scene))) canvas.style.setProperty(name, value);
    const scroller = viewport.parentElement;
    scroller.scrollTop = Math.max(0, (scroller.scrollHeight - scroller.clientHeight) / 2);
  }

  function renderDock() {
    $('#holes').innerHTML = state.seats[0].holes.map(card => face(card, true)).join('');
    $('#shield').hidden = !state.shield;
    $('#hand-count').textContent = state.hand.length + ' 张';
    $('#intel').hidden = !state.intel.length;
    $('#intel').setAttribute('aria-expanded', String(showIntel));
    $('#hand').innerHTML = state.hand.map(instance => {
      const key = instance.key;
      const amount = quote(state, key);
      const def = cards[key];
      return '<button type="button" class="ability' + (unavailable(state, key) ? ' unavailable' : '') +
        '" data-card="' + instance.id + '" data-focus="card-' + instance.id + '" aria-controls="detail" aria-pressed="' +
        (selection?.id === instance.id) + '" aria-label="' + def.name + '，' + amount + ' 筹码">' +
        '<span class="price" aria-hidden="true">' + num(amount) + '</span>' + artwork(key) +
        '<span class="ability-name">' + def.name + '</span></button>';
    }).join('') || '<span class="empty-hand">没有能力牌</span>';

    const action = (intent, text, disabled, variant = '', primary = false) =>
      '<button type="button" class="poker-button ' + variant + '" data-bet="' + intent + '" data-focus="bet-' + intent + '"' +
      (primary ? ' data-tone="primary"' : '') + (disabled ? ' disabled' : '') + '>' + text + '</button>';
    const owed = toCall(state);
    const hero = state.seats[0];
    const actor = activeSeat();
    const active = state.phase === 'active';
    const status = state.phase === 'settled' ? '本手结束' : state.pending ? '请选择候选牌' :
      active ? '轮到你' : hero.folded ? '已弃牌 · 等待下一手' : actor > 0 ? '等待 ' + state.seats[actor].name + ' 行动' : '等待结算';
    $('#controls').dataset.acting = String(active);
    $('#turn').textContent = status;
    $('#clock').hidden = !active;
    $('#clock').innerHTML = icon('clock') + '5:00';
    let controls;
    if (state.phase === 'settled') {
      controls = button('重玩本手', 'data-restart data-focus="next"', 'primary');
    } else if (state.phase === 'opponents') {
      controls = button('推进对手行动', 'data-opponent data-focus="next"');
    } else {
      const inactive = !!state.pending;
      const call = !owed ? '过牌 <span class="check-detail">无需跟注</span>' : hero.stack <= owed ?
        '全下 ' + num(hero.stack) : '跟注 ' + num(owed);
      const options = betOptions();
      if (chosenBet != null && canRaise(state)) {
        chosenBet = Math.min(hero.streetBet + hero.stack, Math.max(options[0].to, chosenBet));
      }
      const betTo = chosenBet ?? options[0].to;
      const presets = canRaise(state) ? '<div class="poker-bet-presets font-sans" role="group" aria-label="下注金额选择">' +
        options.map((option, index) => button(option.label, 'data-preset="' + option.to + '" data-focus="preset-' + index +
          '" aria-pressed="' + (betTo === option.to && options.findIndex(preset => preset.to === betTo) === index) + '"' +
          (inactive ? ' disabled' : ''), 'small')).join('') +
        button('自定义' + icon('up'), 'data-system="bet" data-focus="bet-custom"' + (inactive ? ' disabled' : ''), 'small') + '</div>' : '';
      controls = presets + '<div class="poker-action-buttons">' + action('fold', '弃牌', inactive, 'poker-fold-action') +
        action('call', call, inactive, '', true) + action('raise', (owed ? '加注到 ' : '下注到 ') + num(betTo),
          inactive || !canRaise(state), 'poker-raise-action') + '</div>';
    }
    $('#actions').innerHTML = controls;
  }

  // These presets use the same call-to and clamping formulas as action-view.ts.
  function betOptions() {
    const hero = state.seats[0];
    const owed = toCall(state);
    const min = hero.streetBet + raiseAmount(state);
    const max = hero.streetBet + hero.stack;
    const callTo = hero.streetBet + owed;
    const pot = state.seats.reduce((sum, seat) => sum + seat.total, state.cardFees);
    const clamp = target => Math.min(max, Math.max(min, Math.round(target)));
    return [{ label: '最小', to: min }, { label: '半池', to: clamp(callTo + (pot + owed) / 2) },
      { label: '一池', to: clamp(callTo + pot + owed) }];
  }

  function renderDetails() {
    const panel = $('#detail');
    const instance = state.hand.find(card => card.id === selection?.id);
    const pending = state.pending;
    panel.hidden = !(pending || instance || (showIntel && state.intel.length));
    if (panel.hidden) {
      panel.innerHTML = '';
      return;
    }
    if (pending) {
      panel.innerHTML = '<div class="detail-heading">' + artwork(pending.key) +
        '<div><h2 id="detail-title">' + cards[pending.key].name + ' · 选择一张</h2><p>替换第 ' + (pending.slot + 1) +
        ' 张底牌 · 仅你可见</p></div></div>' +
        '<div class="candidates" aria-label="私有换牌候选">' + pending.candidates.map((card, index) =>
          '<button type="button" class="candidate" data-choice="' + index + '" data-focus="choice-' + index +
          '" aria-pressed="' + (selection?.candidate === index) + '" aria-label="候选 ' + (index + 1) + '，' + faceName(card) +
          '">' + face(card, true) + '</button>').join('') +
        '</div><div class="detail-footer"><span>已付 <strong>' + num(pending.amount) + '</strong> 筹码</span>' +
        button('确认换牌', 'data-confirm-choice data-focus="choose"' + (selection?.candidate == null ? ' disabled' : ''), 'primary') + '</div>';
      return;
    }
    const close = button(icon('close'), 'data-close aria-label="关闭详情"', 'icon quiet');
    if (showIntel) {
      panel.innerHTML = '<div class="detail-heading">' + icon('eye') + '<div><h2 id="detail-title">私密情报</h2><p>仅你可见</p></div>' +
        close + '</div>' + state.intel.map(entry => '<div><p>' + entry.label + '</p><div class="intel-cards">' +
        entry.cards.map(card => face(card, true)).join('') + '</div></div>').join('');
      return;
    }

    const def = cards[instance.key];
    const amount = quote(state, instance.key);
    const reason = unavailable(state, instance.key);
    const targetButton = (text, value, label) => button(text, 'data-target="' + value + '" data-focus="target-' + value +
      '" aria-pressed="' + (selection.target === value) + '" aria-label="' + label + '"');
    let targets = '';
    if (def.target === 'hole') targets = state.seats[0].holes.map((card, i) =>
      targetButton(face(card, true) + '底牌 ' + (i + 1), i, '底牌 ' + (i + 1) + '，' + faceName(card))).join('');
    if (def.target === 'seat') targets = state.seats.map((seat, i) =>
      i && !seat.folded ? targetButton(seat.name, i, seat.name) : '').join('');
    const status = error || reason;
    const disabled = Boolean(reason || (def.target && selection.target == null));
    panel.innerHTML = '<div class="detail-heading">' + artwork(instance.key) +
      '<div><h2 id="detail-title">' + def.name + '</h2><p>' + def.description + '</p></div>' + close + '</div>' +
      (targets ? '<div class="targets">' + targets + '</div>' : '') +
      (status ? '<p class="' + (error || reason.startsWith('筹码不足') ? 'error' : '') + '">' + status + '</p>' : '') +
      '<div class="detail-footer"><span>实付 <strong id="card-quote">' + num(amount) + '</strong> 筹码</span>' +
      button('使用 · ' + num(amount), 'data-use="' + amount + '" data-focus="use"' + (disabled ? ' disabled' : ''), 'primary') + '</div>';
  }

  function renderTip() {
    const id = hoveredLog ?? focusedLog ?? pinnedLog;
    const entry = state.log.find(item => item.id === id);
    const tip = $('#log-tip');
    tip.hidden = !entry;
    document.querySelectorAll('[data-log]').forEach(button => {
      const active = Number(button.dataset.log) === id;
      button.dataset.active = String(active);
      button.setAttribute('aria-expanded', String(active));
      if (active) button.setAttribute('aria-describedby', 'log-tip');
      else button.removeAttribute('aria-describedby');
    });
    if (!entry) {
      tip.innerHTML = '';
      return;
    }
    const context = [entry.actor, entry.action !== 'street' ? streets[entry.street] : '', entry.target ? '目标 ' + entry.target : ''].filter(Boolean).join(' · ');
    const amount = entry.amount ? (entry.card ? '实付 ' + num(entry.amount) + ' 筹码入主池' : num(entry.amount) + ' 筹码') : '';
    tip.innerHTML = (entry.card ? artwork(entry.card) : icon(entry.action)) +
      '<div><strong>' + logHeading(entry) + '</strong>' +
      (context ? '<p>' + context + '</p>' : '') +
      (entry.card ? '<p>' + cards[entry.card].description + '</p>' : '') +
      ([amount, entry.result].some(Boolean) ? '<p class="log-result">' + [amount, entry.result].filter(Boolean).join(' · ') + '</p>' : '') +
      '</div>';
  }

  function renderLog() {
    $('#log').innerHTML = state.log.map(entry => '<button type="button" class="log-entry" data-log="' + entry.id +
      '" data-focus="log-' + entry.id + '" aria-controls="log-tip" aria-label="' + [entry.actor, logHeading(entry)].filter(Boolean).join('，') +
      '">' + (entry.card ? artwork(entry.card) : icon(entry.action)) + '</button>').join('');
    renderTip();
  }

  function render(focus) {
    const priorFocus = document.activeElement?.dataset.focus;
    const scroll = $('#fan').scrollLeft;
    const logScroll = $('#log').scrollTop;
    renderTable();
    renderDock();
    renderDetails();
    renderLog();
    $('#fan').scrollLeft = scroll;
    $('#log').scrollTop = logScroll;
    if (focus || priorFocus) focusAt(focus || priorFocus);
  }

  function start() {
    state = reset(scenario);
    chosenBet = null;
    matchTab = '日志';
    selection = null;
    showIntel = false;
    error = '';
    pinnedLog = hoveredLog = focusedLog = null;
    announce('');
    $('#fan').scrollLeft = 0;
    $('#log').scrollTop = 0;
    render();
  }

  function describeLog(entry) {
    const amount = entry.amount ? ' · ' + num(entry.amount) + ' 筹码' : '';
    return [entry.actor, logHeading(entry)].filter(Boolean).join(' · ') + amount + (entry.result ? ' · ' + entry.result : '');
  }

  function matchContent() {
    const tabs = '<div class="panel-tabs" aria-label="对局信息">' + ['日志', '总览', 'AI'].map(tab =>
      button(tab, 'data-match-tab="' + tab + '" aria-pressed="' + (tab === matchTab) + '"', 'small')).join('') + '</div>';
    const content = matchTab === '日志' ? '<ol>' + state.log.map(entry => '<li>' + describeLog(entry) + '</li>').join('') + '</ol>' :
      matchTab === '总览' ? '<ul>' + state.seats.map(seat => '<li>' + seat.name + ' · 累计下注 ' + num(seat.total) +
        ' · 卡牌支出 ' + num(seat.cardPaid) + '</li>').join('') + '</ul>' : '<p>暂无 AI 判断</p>';
    return tabs + content;
  }

  function panelContent(kind, seatNumber) {
    if (kind === 'menu') {
      const options = Object.entries(scenarioNames).map(([key, name]) => '<option value="' + key + '"' +
        (key === scenario ? ' selected' : '') + '>' + name + '</option>').join('');
      return ['更多操作', '<div class="menu-group"><label for="scenario">演示场景</label><select id="scenario">' +
        options + '</select>' + button(icon('reset'), 'data-restart aria-label="重置场景"', 'icon') + '</div>'];
    }
    if (kind === 'match') return ['对局信息', matchContent()];
    if (kind === 'members') return ['成员管理', '<ul>' + state.seats.map((seat, i) =>
      '<li>' + seatNumbers[i] + ' 号位 · ' + seat.name + ' · ' + (i ? '机器人' : '本人') + '</li>').join('') + '</ul>'];
    if (kind === 'ranks') return ['牌型大小', '<ol><li>皇家同花顺</li><li>同花顺</li><li>四条</li><li>葫芦</li><li>同花</li><li>顺子</li><li>三条</li><li>两对</li><li>一对</li><li>高牌</li></ol>'];
    if (kind === 'pot') return ['底池来源', '<ul>' + state.seats.map(seat =>
      '<li>' + seat.name + ' · 下注 ' + num(seat.total) + (seat.cardPaid ? ' · 卡牌费 ' + num(seat.cardPaid) : '') + '</li>').join('') + '</ul>'];
    if (kind === 'seat') {
      const seat = state.seats[seatNumber];
      return ['玩家信息', '<p>' + seat.name + ' · 剩余 ' + num(seat.stack) + ' 筹码</p>'];
    }
    const hero = state.seats[0];
    const min = betOptions()[0].to;
    const max = hero.streetBet + hero.stack;
    const to = chosenBet ?? min;
    const bounds = ' min="' + min + '" max="' + max + '" value="' + to + '" step="1"';
    return [toCall(state) ? '加注' : '下注', '<form id="bet-form"><label for="bet-number">金额</label>' +
      '<input id="bet-number" type="number" required' + bounds + '><input id="bet-slider" type="range" aria-label="下注金额"' + bounds + '>' +
      '<span>追加 <strong id="bet-extra">' + num(to - hero.streetBet) + '</strong></span><button class="button primary" type="submit">确定金额</button></form>'];
  }

  function placePanel(trigger, kind) {
    const panel = $('#system-panel');
    const anchor = trigger.getBoundingClientRect();
    const frame = panel.getBoundingClientRect();
    panel.style.left = Math.max(8, Math.min(innerWidth - frame.width - 8, anchor.right - frame.width)) + 'px';
    const below = anchor.bottom + 8;
    const above = anchor.top - frame.height - 8;
    panel.style.top = Math.max(8, kind === 'bet' || below + frame.height > innerHeight ? above : below) + 'px';
  }

  function openPanel(trigger) {
    const kind = trigger.dataset.system;
    const panel = $('#system-panel');
    if (panel.open && panel.dataset.kind === kind && kind !== 'seat') return panel.close();
    const [title, content] = panelContent(kind, Number(trigger.dataset.seatInfo));
    panel.dataset.kind = kind;
    panel.innerHTML = '<header><h2 id="system-title">' + title + '</h2>' + button(icon('close'), 'data-system-close aria-label="关闭"', 'icon quiet') +
      '</header><div id="system-body">' + content + '</div>';
    if (!panel.open) panel.show();
    placePanel(trigger, kind);
    if (kind === 'bet') $('#bet-number').focus();
  }

  function updateBetField(event) {
    const field = event.target;
    if (field.id !== 'bet-number' && field.id !== 'bet-slider') return;
    const other = field.id === 'bet-number' ? $('#bet-slider') : $('#bet-number');
    other.value = field.value;
    $('#bet-extra').textContent = field.validity.valid ? num(Number(field.value) - state.seats[0].streetBet) : '—';
  }

  function toggleLog(id) {
    const close = pinnedLog === id;
    pinnedLog = close ? null : id;
    if (close) hoveredLog = focusedLog = null;
    renderTip();
  }

  function closeLog() {
    pinnedLog = hoveredLog = focusedLog = null;
    renderTip();
  }

  function onAdvance() {
    const instance = state.hand.find(card => card.id === selection?.id);
    const old = instance ? quote(state, instance.key) : null;
    const problem = advanceOpponent(state);
    if (problem) return announce(problem);
    chosenBet = null;
    error = instance && quote(state, instance.key) !== old ? '费用已变化，请按当前金额确认' : '';
    if (error) announce(error);
    render(state.phase === 'active' ? (selection ? 'card-' + selection.id : 'bet-call') : 'next');
  }

  document.querySelectorAll('[data-symbol]').forEach(element => { element.innerHTML = icon(element.dataset.symbol); });
  $('#intel').innerHTML = icon('eye');
  $('#shield').innerHTML = icon('shield') + '<span class="sr-only">反制咒已生效</span>';
  const systemPanel = $('#system-panel');
  systemPanel.addEventListener('change', event => {
    if (event.target.id !== 'scenario') return;
    scenario = event.target.value;
    systemPanel.close();
    start();
    $('[data-system="menu"]').focus();
  });
  systemPanel.addEventListener('input', updateBetField);
  systemPanel.addEventListener('submit', event => {
    if (event.target.id !== 'bet-form') return;
    event.preventDefault();
    chosenBet = $('#bet-number').valueAsNumber;
    systemPanel.close();
    render('bet-custom');
  });
  $('#intel').addEventListener('click', () => {
    if (state.pending) return announce('请先选择换牌候选');
    selection = null;
    showIntel = !showIntel;
    render();
  });

  $('#log').addEventListener('pointerover', event => {
    if (event.pointerType !== 'mouse') return;
    const entry = event.target.closest('[data-log]');
    if (entry && !entry.contains(event.relatedTarget)) {
      hoveredLog = Number(entry.dataset.log);
      renderTip();
    }
  });
  $('#log').addEventListener('pointerout', event => {
    const entry = event.target.closest('[data-log]');
    if (entry && !entry.contains(event.relatedTarget)) {
      hoveredLog = null;
      renderTip();
    }
  });
  $('#log').addEventListener('focusin', event => {
    if (!event.target.matches(':focus-visible')) return;
    focusedLog = Number(event.target.dataset.log);
    renderTip();
  });
  $('#log').addEventListener('focusout', () => {
    focusedLog = null;
    renderTip();
  });

  document.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (target?.hasAttribute('data-system')) return openPanel(target);
    if (target?.hasAttribute('data-system-close')) return systemPanel.close();
    if (target?.hasAttribute('data-match-tab')) {
      matchTab = target.dataset.matchTab;
      $('#system-body').innerHTML = matchContent();
      $('#system-body [aria-pressed="true"]').focus();
      return;
    }
    if (systemPanel.open && !event.target.closest('#system-panel')) systemPanel.close();
    if (target?.hasAttribute('data-log')) {
      toggleLog(Number(target.dataset.log));
      return;
    }
    if (pinnedLog != null && !event.target.closest('#log-tip')) closeLog();
    if (!target) return;
    if (target.hasAttribute('data-card')) {
      if (state.pending) return announce('请先选择换牌候选');
      const id = Number(target.dataset.card);
      selection = selection?.id === id ? null : { id, target: null };
      showIntel = false;
      error = '';
      render('card-' + id);
      if (!event.detail && selection) {
        const first = $('#detail [data-target], #detail [data-use]:enabled') || $('#detail [data-close]');
        first?.focus({ preventScroll: true });
      }
    } else if (target.hasAttribute('data-target')) {
      selection.target = Number(target.dataset.target);
      error = '';
      render();
    } else if (target.hasAttribute('data-close')) {
      const focus = selection ? 'card-' + selection.id : null;
      selection = null;
      showIntel = false;
      render(focus);
      if (!focus) $('#intel').focus();
    } else if (target.hasAttribute('data-use')) {
      error = use(state, selection.id, selection.target, Number(target.dataset.use)) || '';
      if (error) {
        announce(error);
        render();
        return;
      }
      const privateEffect = ['preview', 'inspect'].includes(state.log[0].card);
      const card = cards[state.log[0].card].name;
      selection = null;
      showIntel = privateEffect;
      announce(card + (state.pending ? '已使用，请选择候选' : '已使用'));
      render(state.pending ? 'choice-0' : 'bet-call');
    } else if (target.hasAttribute('data-choice')) {
      selection = { candidate: Number(target.dataset.choice) };
      render();
    } else if (target.hasAttribute('data-confirm-choice')) {
      const problem = choose(state, selection?.candidate);
      if (problem) return announce(problem);
      selection = null;
      announce('换牌完成');
      render('bet-call');
    } else if (target.hasAttribute('data-bet')) {
      const contribution = (chosenBet ?? betOptions()[0].to) - state.seats[0].streetBet;
      const problem = bet(state, target.dataset.bet, contribution);
      if (problem) return announce(problem);
      chosenBet = null;
      selection = null;
      showIntel = false;
      error = '';
      render('next');
    } else if (target.hasAttribute('data-preset')) {
      chosenBet = Number(target.dataset.preset);
      render();
    } else if (target.hasAttribute('data-opponent')) {
      onAdvance();
    } else if (target.hasAttribute('data-restart')) {
      if (systemPanel.open) systemPanel.close();
      start();
      focusAt('bet-call');
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (systemPanel.open) {
      systemPanel.close();
    } else if (!$('#log-tip').hidden) {
      closeLog();
    } else if (!state.pending && (selection || showIntel)) {
      const focus = selection ? 'card-' + selection.id : null;
      selection = null;
      showIntel = false;
      render(focus);
      if (!focus) $('#intel').focus();
    }
  });

  const table = $('.poker-table');
  const viewport = $('.poker-canvas-viewport');
  const resize = new ResizeObserver(() => {
    table.dataset.compactControls = String(table.clientWidth <= 850);
    fitCanvas();
  });
  resize.observe(table);
  resize.observe(viewport);
  start();
})();
  </script>
</body>
</html>
