<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>德州扑克 · 卡牌舞台交互原型</title>
  <!--
    2026-11-03 · 仅供交互评审，不接入服务端、账号、存储或真实牌局。
    依据 cards-v1 定义及 PokerCardChoiceSpec：主动确认、真实费用、两类候选、
    关面板保留待选、倒计时不中断。使用仓库正式卡面，不改变玩法或系统 UI。
    打开本文件即可体验；图片相对引用仓库资源，无 CDN、框架或新增依赖。
    试玩：精准调包 → 选底牌与玩家；三思而行 → 能力牌候选；
    左右逢源 → 底牌候选；慷慨解囊 → 20 筹码支付；更多手牌 → 分页。
  -->
  <style>
    :root {
      color-scheme: light;
      --background: oklch(.9702 0 0); --surface: oklch(1 0 0);
      --foreground: oklch(.2103 .0059 285.89); --muted: oklch(.49 .0138 285.94);
      --line: oklch(.90 .004 286.32); --accent: oklch(.6204 .195 253.83);
      --danger: oklch(.57 .19 25.74); --default: oklch(.94 .001 286.375);
      --stage: oklch(.18 .018 174); --stage-deep: oklch(.12 .012 174);
      --stage-ink: oklch(.95 .018 91); --stage-muted: oklch(.77 .023 161);
      --stage-line: oklch(.43 .035 158); --stage-raised: oklch(.25 .026 169);
      --brass: oklch(.79 .085 81); --brass-light: oklch(.9 .066 90);
      --brass-dark: oklch(.43 .069 77); --card-paper: oklch(.95 .025 80);
      --card-ink: oklch(.25 .023 166); --card-muted: oklch(.42 .026 164);
      --sage: oklch(.81 .067 161); --shadow: oklch(.075 .009 165 / .55);
      --veil: oklch(.12 .02 169 / .92); --veil-edge: oklch(.12 .02 169 / .72);
      --z-table: 0; --z-overlay: 10; --z-flight: 20; --z-notice: 30; --z-demo: 40;
      --ease: cubic-bezier(.22, 1, .36, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-synthesis: none; -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible { outline: 2px solid var(--brass-light); outline-offset: 5px; }
    .table-shell button:focus-visible, .demo-bar button:focus-visible { outline-color: var(--accent); }
    button svg { width: 18px; height: 18px; flex: none; }
    button[hidden], [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .demo-bar { position: relative; z-index: var(--z-demo); min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 18px; background: var(--surface); color: var(--muted); border-bottom: 1px solid var(--line); font-size: 11px; }
    .demo-label { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .demo-label strong { font-weight: 600; color: var(--foreground); }
    .demo-actions { display: flex; gap: 4px; align-items: center; }
    .demo-actions button { padding: 5px 9px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .demo-actions button:hover, .demo-actions button[aria-pressed="true"] { background: var(--default); color: var(--foreground); }
    .demo-actions .demo-reset { margin-left: 7px; border-left: 1px solid var(--line); border-radius: 0; }
    .table-shell { position: relative; min-height: calc(100dvh - 40px); overflow: hidden; background: var(--background); }
    .table-top { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .room-info { display: flex; gap: 13px; align-items: center; font-size: 13px; }
    .room-info span, .table-top > span { color: var(--muted); font-size: 12px; }
    .scene { position: relative; width: min(1180px, 100%); height: calc(100dvh - 220px); min-height: 450px; max-height: 730px; margin: 0 auto; }
    .felt { position: absolute; inset: 12% 10% 15%; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); }
    .felt::after { content: ""; position: absolute; inset: 20px; border: 1px solid var(--line); border-radius: 50%; }
    .seat { position: absolute; width: 144px; text-align: center; transform: translate(-50%, -50%); }
    .seat.north { left: 50%; top: 15%; } .seat.west { left: 15%; top: 51%; } .seat.east { left: 85%; top: 51%; } .seat.south { left: 50%; top: 84%; }
    .seat-backs { display: flex; justify-content: center; gap: 3px; height: 44px; margin-bottom: 7px; }
    .card-back { display: grid; place-items: center; width: 30px; height: 42px; background: var(--default); border: 1px solid var(--line); border-radius: 3px; font: 22px Georgia, serif; color: var(--muted); }
    .seat-plate { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 12px; display: flex; gap: 9px; align-items: center; text-align: left; }
    .avatar { width: 31px; height: 31px; border-radius: 50%; background: var(--default); display: grid; place-items: center; flex: none; font-size: 12px; }
    .seat-name { font-size: 11px; color: var(--muted); } .seat-stack { display: block; font-size: 20px; font-weight: 550; }
    .seat.south .seat-plate { outline: 2px solid var(--accent); outline-offset: 3px; }
    .seat.south .seat-backs { height: 65px; }
    .playing { display: block; width: 47px; height: auto; aspect-ratio: 5 / 7; border-radius: 4px; }
    .table-board { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); display: flex; gap: 6px; }
    .table-board .playing { width: 51px; }
    .empty-card { width: 51px; aspect-ratio: 5 / 7; border: 1px dashed var(--line); border-radius: 4px; }
    .table-pots { position: absolute; top: 31%; left: 50%; translate: -50% 0; display: flex; gap: 54px; text-align: center; }
    .table-pots small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .table-pots strong { font-size: 28px; font-weight: 550; }
    .table-street { position: absolute; top: 64%; left: 50%; translate: -50% 0; color: var(--muted); font-size: 12px; }
    .table-actions { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 19px 20px 27px; }
    .table-actions button { border: 1px solid var(--line); padding: 12px 22px; border-radius: 8px; background: var(--surface); color: var(--foreground); }
    .table-actions .cards-entry { background: var(--foreground); color: var(--surface); display: flex; gap: 10px; align-items: center; border-color: var(--foreground); }
    .hand-count { display: grid; place-items: center; min-width: 22px; height: 22px; padding-inline: 5px; border-radius: 4px; font-size: 12px; background: color-mix(in oklch, var(--surface) 18%, transparent); }
    .table-actions .table-passive { opacity: .55; }
    .table-turn { color: var(--muted); font-size: 12px; margin-right: 10px; }
    .status-on-table { color: var(--muted); font-size: 11px; text-align: center; min-height: 18px; }

    /* The game overlay has no dialog box. The original table remains mounted behind it. */
    .card-overlay { position: fixed; inset: 40px 0 0; z-index: var(--z-overlay); color: var(--stage-ink); overflow: hidden auto; overscroll-behavior: contain; background: radial-gradient(ellipse at 50% 44%, var(--veil) 22%, var(--veil-edge) 100%); animation: veil-in 240ms ease-out both; }
    .overlay-layout { min-height: 100%; display: flex; flex-direction: column; }
    .stage-hud { width: min(1180px, calc(100% - 64px)); min-height: 106px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; border-bottom: 1px solid color-mix(in oklch, var(--stage-line) 55%, transparent); }
    .round-context { font-size: 13px; display: flex; align-items: center; gap: 12px; }
    .round-context > span { color: var(--stage-muted); }
    .round-context strong { font-weight: 500; }
    .hud-board { display: flex; align-items: center; gap: 6px; }
    .hud-board .playing { width: 34px; border-radius: 3px; }
    .hud-board .empty-card { width: 34px; border-color: var(--stage-line); }
    .hud-board-label { font-size: 11px; margin-right: 8px; color: var(--stage-muted); }
    .hud-right { display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
    .time { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .035em; display: flex; gap: 9px; align-items: center; }
    .time svg { color: var(--brass); width: 21px; height: 21px; }
    .time[data-urgent="true"] { color: var(--brass-light); }
    .close-overlay { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: transparent; color: var(--stage-muted); border: 1px solid var(--stage-line); transition: color 150ms, border-color 150ms; }
    .close-overlay:hover { color: var(--stage-ink); border-color: var(--brass); }
    .stage-heading { text-align: center; padding: 31px 20px 4px; }
    .stage-heading h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: .12em; text-wrap: balance; }
    .stage-heading p { font-size: 12px; color: var(--stage-muted); margin: 12px 0 0; letter-spacing: .035em; }
    .stage-heading .heading-rule { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 17px auto 0; color: var(--brass); }
    .heading-rule::before, .heading-rule::after { content: ""; height: 1px; width: 44px; background: color-mix(in oklch, var(--brass) 40%, transparent); }
    .heading-rule svg { width: 10px; height: 10px; }
    .view { flex: 1; display: flex; flex-direction: column; }
    .hand-stage { --card-w: min(214px, 17.2vw); position: relative; min-height: 365px; flex: 1; display: flex; align-items: center; justify-content: center; padding: 37px 44px 46px; }
    .hand-stage::after { content: ""; position: absolute; bottom: 20px; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent, var(--stage-line), transparent); pointer-events: none; }
    .hand-row { display: flex; justify-content: center; align-items: center; width: 100%; perspective: 1300px; }
    .card-slot { position: relative; width: var(--card-w); flex: none; margin-left: -7px; padding: 0; transform: translateY(var(--rest-y, 0px)) rotate(var(--rest-r, 0deg)); transition: transform 300ms var(--ease), filter 200ms; z-index: 1; filter: drop-shadow(0 12px 13px var(--shadow)); }
    .card-slot:first-child { margin-left: 0; }
    .card-slot:hover, .card-slot:focus-within { transform: translateY(-22px) rotate(0deg) scale(1.065); z-index: 3; }
    .card-slot:has(.ability-card:active) { transform: translateY(-17px) rotate(0deg) scale(1.035); }
    .card-slot.is-entering { animation: deal-in 540ms var(--ease) both; animation-delay: calc(var(--deal-i) * 55ms); }
    .ability-card { display: block; position: relative; width: 100%; aspect-ratio: .64; padding: 0; border: 0; border-radius: 12px; text-align: left; color: var(--card-ink); background: var(--card-paper); transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); transition: transform 160ms ease-out; isolation: isolate; }
    .ability-card::before { content: ""; position: absolute; inset: 0; z-index: 2; border: 2px solid color-mix(in oklch, var(--brass-dark) 70%, var(--card-paper)); border-radius: inherit; pointer-events: none; }
    .ability-card::after { content: ""; position: absolute; inset: 5px; z-index: 2; border: 1px solid color-mix(in oklch, var(--brass) 55%, transparent); border-radius: 8px; pointer-events: none; }
    .card-slot:hover .ability-card::before, .card-slot:focus-within .ability-card::before, .card-slot.is-chosen .ability-card::before { border-color: var(--brass-light); }
    .ability-art { display: block; width: 100%; height: 56%; object-fit: cover; object-position: 50% 48%; border-radius: 12px 12px 0 0; user-select: none; -webkit-user-drag: none; }
    .card-type { position: absolute; top: 13px; left: 13px; z-index: 1; display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--card-muted); }
    .card-type svg { width: 13px; height: 13px; }
    .card-body { position: absolute; inset: 54% 0 0; padding: 12px 19px 16px; background: var(--card-paper); border-radius: 0 0 12px 12px; display: flex; flex-direction: column; }
    .card-name { display: block; text-align: center; font: 600 21px/1.3 "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif; letter-spacing: .065em; }
    .card-divider { display: flex; align-items: center; gap: 8px; color: var(--brass-dark); margin: 8px 8px 7px; }
    .card-divider::before, .card-divider::after { content: ""; height: 1px; flex: 1; background: color-mix(in oklch, var(--brass-dark) 32%, transparent); }
    .card-divider svg { width: 5px; height: 5px; }
    .card-description { display: block; font-size: 11.5px; line-height: 1.7; text-align: center; text-wrap: pretty; }
    .card-cost { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: var(--card-muted); margin-top: auto; padding-top: 6px; }
    .card-cost svg { width: 11px; height: 11px; }
    .card-locked { position: absolute; inset: 0; border-radius: inherit; background: color-mix(in oklch, var(--stage) 30%, transparent); z-index: 3; display: flex; justify-content: center; align-items: flex-end; padding: 14px 7px; }
    .card-locked span { color: var(--stage-ink); background: var(--stage); border-radius: 4px; padding: 5px 9px; font-size: 11px; }
    .card-slot.is-unavailable .ability-art { filter: saturate(.5); }
    .card-slot.is-unavailable:hover { transform: translateY(-12px) rotate(0deg) scale(1.025); }
    .page-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; width: 40px; height: 48px; padding: 0; border: 1px solid var(--stage-line); border-radius: 7px; display: grid; place-items: center; color: var(--stage-ink); background: color-mix(in oklch, var(--stage) 60%, transparent); }
    .page-arrow:hover { border-color: var(--brass); }
    .page-arrow:disabled { opacity: .22; }
    .page-arrow.previous { left: 20px; } .page-arrow.next { right: 20px; }
    .hand-status { min-height: 34px; font-size: 12px; color: var(--stage-muted); text-align: center; padding: 0 20px; }
    .hand-status strong { color: var(--brass-light); font-weight: 500; }
    .stage-footer { width: min(1120px, calc(100% - 64px)); display: flex; justify-content: space-between; align-items: center; gap: 20px; margin: 0 auto; min-height: 77px; padding: 14px 0 20px; }
    .held-count { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--stage-muted); }
    .held-count svg { width: 17px; height: 17px; color: var(--brass); }
    .held-count b { color: var(--stage-ink); font-weight: 500; }
    .key-hints { display: flex; align-items: center; gap: 15px; font-size: 11px; color: var(--stage-muted); }
    kbd { font: inherit; padding: 2px 4px; border: 1px solid var(--stage-line); border-radius: 3px; color: var(--stage-ink); margin-right: 4px; }
    .text-action { border: 0; padding: 9px 0; color: var(--stage-muted); background: transparent; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .text-action:hover { color: var(--stage-ink); }
    .footer-actions { display: flex; align-items: center; gap: 20px; }
    .inspect-view { padding: 24px 32px 30px; }
    .inspect-top { width: min(850px, 100%); margin: 0 auto 15px; }
    .inspect-layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 74px; width: min(850px, 100%); margin: auto; align-items: center; }
    .inspect-card { filter: drop-shadow(0 14px 16px var(--shadow)); align-self: center; }
    .inspect-card .ability-card { pointer-events: none; }
    .inspect-card .card-name { font-size: 23px; }
    .inspect-card .card-description { font-size: 12px; }
    .inspect-details { animation: details-in 260ms var(--ease) both; }
    .inspect-category { display: inline-flex; gap: 7px; align-items: center; font-size: 12px; color: var(--brass); }
    .inspect-category svg { width: 16px; height: 16px; }
    .inspect-details h2 { margin: 11px 0 14px; font: 600 29px/1.3 "Songti SC", "Noto Serif CJK SC", "STSong", Georgia, serif; letter-spacing: .075em; }
    .full-description { max-width: 38ch; margin: 0; font-size: 13px; line-height: 1.85; color: var(--stage-muted); text-wrap: pretty; }
    .selection-fields { display: flex; flex-direction: column; gap: 22px; margin-top: 24px; }
    .choice-field { border: 0; padding: 0; margin: 0; min-width: 0; }
    .choice-field legend { font-size: 12px; padding: 0; margin-bottom: 10px; color: var(--stage-ink); }
    .hole-options { display: flex; gap: 13px; }
    .hole-choice { position: relative; padding: 0; border: 0; border-radius: 5px; background: transparent; transition: transform 180ms var(--ease); }
    .hole-choice .playing { width: 49px; }
    .hole-choice:hover { transform: translateY(-4px); }
    .hole-choice[aria-pressed="true"] { outline: 2px solid var(--brass-light); outline-offset: 4px; transform: translateY(-4px); }
    .selection-tick { position: absolute; right: -7px; bottom: -5px; width: 19px; height: 19px; background: var(--brass-light); border-radius: 50%; color: var(--stage-deep); display: grid; place-items: center; }
    .selection-tick svg { width: 12px; height: 12px; }
    .target-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .target-choice { min-height: 48px; padding: 9px 12px; display: flex; gap: 9px; align-items: center; background: transparent; border: 1px solid var(--stage-line); border-radius: 7px; color: var(--stage-muted); font-size: 12px; }
    .target-choice .avatar { width: 25px; height: 25px; font-size: 10px; background: var(--stage-raised); color: var(--stage-ink); }
    .target-choice:hover { border-color: var(--brass); color: var(--stage-ink); }
    .target-choice[aria-pressed="true"] { border-color: var(--brass-light); color: var(--brass-light); background: var(--stage-raised); }
    .target-choice > svg { width: 13px; height: 13px; }
    .cast-area { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--stage-line); }
    .intent-preview { font-size: 12px; line-height: 1.7; color: var(--stage-muted); margin: 0 0 13px; min-height: 21px; }
    .payment { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; color: var(--stage-muted); font-size: 12px; margin-bottom: 16px; }
    .payment strong { color: var(--brass-light); font-weight: 500; }
    .payment span + span { padding-left: 9px; border-left: 1px solid var(--stage-line); }
    .game-button { min-height: 46px; min-width: 190px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 24px; border: 0; border-radius: 6px; background: var(--brass); color: var(--stage-deep); box-shadow: inset 0 -3px 0 color-mix(in oklch, var(--brass-dark) 70%, transparent), inset 0 1px 0 var(--brass-light); font-size: 13px; font-weight: 600; letter-spacing: .04em; transition: background 150ms, transform 150ms; }
    .game-button:hover { background: var(--brass-light); transform: translateY(-1px); }
    .game-button:active { transform: translateY(1px); }
    .game-button:disabled { background: var(--stage-raised); color: var(--stage-muted); box-shadow: inset 0 0 0 1px var(--stage-line); transform: none; }
    .game-button svg { width: 16px; height: 16px; }
    .cast-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .inspect-warning { font-size: 12px; line-height: 1.7; color: var(--brass-light); }
    .candidate-stage { --card-w: min(236px, 23vw); min-height: 340px; flex: 1; display: flex; align-items: center; justify-content: center; padding: 36px 28px 30px; }
    .candidate-stage .hand-row { gap: 26px; }
    .candidate-stage .card-slot { margin: 0; }
    .candidate-stage .card-slot.is-chosen { transform: translateY(-15px) scale(1.035); }
    .candidate-stage .card-slot.is-chosen .ability-card { outline: 2px solid var(--brass-light); outline-offset: 5px; }
    .candidate-stage .card-slot.is-chosen::after { content: "已选择"; position: absolute; left: 50%; bottom: -29px; translate: -50% 0; color: var(--brass-light); font-size: 11px; white-space: nowrap; }
    .candidate-footer { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; padding: 13px 20px 29px; }
    .candidate-footer p { margin: 0; color: var(--stage-muted); font-size: 11px; text-align: center; line-height: 1.7; }
    .poker-candidate { aspect-ratio: 5 / 7; border-radius: 9px; background: transparent; border: 0; padding: 0; display: block; width: 100%; }
    .poker-candidate .playing { width: 100%; border-radius: 9px; }
    .candidate-stage.poker-candidates { --card-w: min(172px, 21vw); min-height: 320px; }
    .poker-candidates .card-slot.is-chosen .poker-candidate { outline: 2px solid var(--brass-light); outline-offset: 6px; }
    .private-view { align-items: center; justify-content: center; padding: 36px 24px; gap: 24px; }
    .private-label { color: var(--brass); display: flex; align-items: center; gap: 7px; font-size: 12px; }
    .private-label svg { width: 15px; height: 15px; }
    .private-view h2 { font-size: 22px; font-weight: 500; margin: 0; }
    .private-card { width: 112px; filter: drop-shadow(0 9px 12px var(--shadow)); animation: private-reveal 430ms var(--ease) both; }
    .private-card .playing { width: 100%; }
    .private-view p { margin: 0; max-width: 35ch; font-size: 12px; line-height: 1.8; text-align: center; color: var(--stage-muted); }
    .empty-hand { min-height: 310px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: var(--stage-muted); font-size: 13px; }
    .empty-hand svg { color: var(--brass); width: 36px; height: 36px; }
    .notice { position: fixed; z-index: var(--z-notice); bottom: 110px; left: 50%; translate: -50% 0; max-width: calc(100% - 32px); padding: 13px 20px; border-radius: 6px; background: var(--stage); color: var(--stage-ink); font-size: 13px; display: flex; gap: 10px; align-items: center; text-align: center; animation: details-in 220ms var(--ease) both; pointer-events: none; }
    .notice svg { width: 16px; height: 16px; flex: none; color: var(--brass); }
