<body>
<main class="app">
  <header class="topbar"><div class="room"><strong>#441769</strong><span>第 1 手 · 陪练</span></div><span class="prototype">筹码动效原型</span></header>
  <section class="stage" aria-label="三人牌桌">
    <div class="table" aria-hidden="true"></div>
    <div class="pot"><span class="pot-label">底池</span><strong class="pot-amount" id="pot-amount">30</strong><div class="pile" id="pile" role="img" aria-label="底池筹码"></div></div>
    <div class="board" aria-label="公共牌：黑桃K、红桃9、梅花7"><div class="card">K<span>♠</span></div><div class="card red">9<span>♥</span></div><div class="card">7<span>♣</span></div><div class="card empty"></div><div class="card empty"></div></div>
    <div class="caption"><b>翻牌</b>短牌 32 张 · 盲注 5 / 10</div>
    <div class="seat" data-seat="0"><div class="hand" aria-label="两张暗牌"><div class="card back">♠</div><div class="card back">♠</div></div><div class="plate"><span class="avatar">1</span><div><span class="name">陪练 1</span><strong class="balance">4,990</strong></div></div><div class="receipt">已下注 10</div></div>
    <div class="seat" data-seat="1"><div class="hand" aria-label="两张暗牌"><div class="card back">♠</div><div class="card back">♠</div></div><div class="plate"><span class="avatar">2</span><div><span class="name">陪练 2</span><strong class="balance">4,990</strong></div></div><div class="receipt">已下注 10</div></div>
    <div class="seat" data-seat="2"><div class="hand" aria-label="你的手牌：方块8、方块A"><div class="card red">8<span>♦</span></div><div class="card red">A<span>♦</span></div></div><div class="plate"><span class="avatar">3</span><div><span class="name">你</span><strong class="balance">4,990</strong></div></div><div class="receipt">已下注 10</div></div>
  </section>
  <footer class="dock"><div class="dock-inner">
    <div class="demo-row"><div class="legend" aria-label="筹码面额" id="legend"></div><div class="demo-buttons"><button type="button" id="demo">连续下注演示</button><button type="button" class="quiet" id="reset">重置底池</button></div></div>
    <form class="bet-form" id="bet-form"><label class="field">玩家<select id="player"><option value="2">你</option><option value="0">陪练 1</option><option value="1">陪练 2</option></select></label><label class="field">下注<input id="amount" type="number" min="1" max="5000" step="1" value="38" required></label><div class="presets" aria-label="下注金额预设"><button type="button" data-amount="8" aria-pressed="false">8</button><button type="button" data-amount="38" aria-pressed="true">38</button><button type="button" data-amount="100" aria-pressed="false">100</button><button type="button" data-amount="200" aria-pressed="false">200</button><button type="button" data-amount="501" aria-pressed="false">501</button></div><button type="submit" class="primary" id="bet">下注 38</button></form>
    <div class="status-row"><div class="breakdown" id="breakdown"></div><span id="status" role="status" aria-live="polite">准备下注</span></div>
  </div></footer>
</main>
<script>
(() => {
  'use strict';
  const values = [500, 200, 100, 25, 10, 5, 1];
  const $ = (selector) => document.querySelector(selector);
  const stage = $('.stage'), pile = $('#pile'), amountInput = $('#amount');
  const seats = [...document.querySelectorAll('.seat')];
  const format = (value) => value.toLocaleString('zh-CN');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let total = 0, counts = {}, balances = [4990, 4990, 4990], generation = 0, busy = false;
  const animations = new Set();
  let potStacks = [];
  function decompose(amount) {
    if (!Number.isSafeInteger(amount) || amount < 0) throw new Error('筹码金额必须为非负安全整数');
    const chips = [];
    for (const value of values) {
      const count = Math.floor(amount / value);
      for (let i = 0; i < count; i++) chips.push(value);
      amount %= value;
    }
    return chips;
  }
  // Make change before transferring: both hands must sum to the original balance.
  function planBet(balance, amount) {
    if (!Number.isSafeInteger(amount) || amount < 1 || amount > balance) throw new Error('下注不能超过剩余筹码');
    const remaining = balance - amount;
    return {remaining, kept: decompose(remaining), outgoing: decompose(amount)};
  }
  // Seeded offsets remain identical between renders; layout never uses Math.random().
  function noise(seed) {
    let hash = Math.imul(seed + 1, 0x45d9f3b);
    hash = Math.imul(hash ^ (hash >>> 16), 0x45d9f3b);
    return ((hash ^ (hash >>> 16)) >>> 0) / 4294967296;
  }
  function newStack(stacks) {
    const index = stacks.length;
    const angle = index * 2.399963 + .24;
    const radius = index === 0 ? 0 : .94 * Math.sqrt(index);
    const stack = {chips:[], capacity:8 + index % 3, x:Math.cos(angle) * radius, y:Math.sin(angle) * radius * .35};
    stacks.push(stack);
    return stack;
  }
  // Small holdings share a short mixed stack. Larger holdings retain distinct tall stacks.
  function addToCluster(stacks, value) {
    const candidates = stacks.filter(stack => stack.chips.length < stack.capacity &&
      (stack.chips.includes(value) || stack.chips.length < 5));
    const score = stack => (stack.chips.includes(value) ? -4 : 0) + stack.chips.length * .45;
    candidates.sort((a,b) => score(a) - score(b));
    const stack = candidates[0] || newStack(stacks);
    const level = stack.chips.length;
    stack.chips.push(value);
    return {stack, index:stacks.indexOf(stack), level};
  }
  // Build complete large stacks first, then tuck the 1–3 spare chips into mixed stacks.
  function bankLayout(chips) {
    const stacks = [], spare = [];
    for (const value of values) {
      let count = chips.filter(chipValue => chipValue === value).length;
      while (count >= 4) {
        const stack = newStack(stacks);
        const height = Math.min(stack.capacity, count);
        stack.chips = Array(height).fill(value); count -= height;
      }
      for (let i = 0; i < count; i++) spare.push(value);
    }
    spare.forEach(value => addToCluster(stacks, value));
    return stacks;
  }
  function positionChip(node, stack, index, level, seed = 0) {
    const key = seed * 991 + index * 131 + level * 17;
    const dx = (noise(key) - .5) * 3.2;
    const dy = (noise(key + 3) - .5) * 1.4;
    const turn = (noise(key + 7) - .5) * 24;
    node.style.left = `calc(50% + ${stack.x} * var(--cluster-gap) + ${dx}px - var(--chip-size) / 2)`;
    node.style.bottom = `calc(var(--cluster-base) + ${stack.y} * var(--cluster-gap) + ${level} * var(--cluster-rise) + ${dy}px)`;
    // Back stacks paint before front stacks; levels remain in physical stacking order.
    node.style.zIndex = String(Math.round((8 - stack.y) * 1000) + level);
    node.style.setProperty('--turn', `${turn}deg`);
    node.dataset.stack = String(index); node.dataset.level = String(level); node.dataset.turn = String(turn);
  }
  function renderBank(seat, chips = decompose(balances[seat])) {
    let bank = seats[seat].querySelector('.bank');
    if (!bank) {
      bank = document.createElement('div'); bank.className = 'bank'; bank.setAttribute('role', 'img');
      seats[seat].append(bank);
    }
    const stacks = bankLayout(chips), fragment = document.createDocumentFragment();
    stacks.forEach((stack,index) => {
      stack.chips.forEach((value,level) => {
        const node = chip(value);
        positionChip(node, stack, index, level, seat + 1);
        fragment.append(node);
      });
    });
    bank.replaceChildren(fragment); bank.dataset.empty = String(!chips.length);
    bank.setAttribute('aria-label', `${seats[seat].querySelector('.name').textContent}剩余 ${format(chips.reduce((sum,value) => sum + value,0))} 筹码，${chips.length} 枚`);
    return bank;
  }
  function chip(value) {
    const node = document.createElement('span');
    node.className = 'chip'; node.dataset.value = String(value);
    node.style.setProperty('--chip-color', `var(--chip-${value})`);
    let edge = '';
    for (let i = 0; i < 8; i++) edge += `<path d="M 28 3 L 36 3 L 35 12 L 29 12 Z" fill="var(--surface)" opacity=".92" transform="rotate(${i * 45} 32 32)"/>`;
    node.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="var(--chip-color)" stroke="color-mix(in oklch,var(--chip-color) 65%,var(--foreground))" stroke-width="1.5"/>${edge}<circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" opacity=".68" stroke-width="1"/><circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" opacity=".3" stroke-dasharray="1.2 2.5"/><text x="32" y="33" text-anchor="middle" dominant-baseline="middle" fill="currentColor">${value}</text><path d="M 9 19 A 27 27 0 0 1 48 9" fill="none" stroke="var(--surface)" opacity=".4" stroke-width="1.5"/></svg>`;
    return node;
  }
  // Append each wager's actual chips; never exchange the accumulated pot for larger denominations.
  function reserveChip(value) {
    counts[value] = (counts[value] || 0) + 1;
    const {stack,index,level} = addToCluster(potStacks, value);
    const node = chip(value);
    positionChip(node, stack, index, level);
    node.style.visibility = 'hidden';
    pile.append(node);
    return node;
  }
  function updateTotal(value) {
    total += value;
    const label = $('#pot-amount');
    label.textContent = format(total);
    label.removeAttribute('data-changed');
    requestAnimationFrame(() => label.setAttribute('data-changed', ''));
    pile.setAttribute('aria-label', `底池 ${total}，${Object.entries(counts).map(([v,n]) => `${n} 枚 ${v}`).join('，')}`);
  }
  function setBusy(value) {
    busy = value;
    for (const node of document.querySelectorAll('#bet-form button,#bet-form input,#bet-form select,#demo')) node.disabled = value;
  }
  function status(text, error = false) { $('#status').textContent = text; $('#status').dataset.error = String(error); }
  function preview() {
    const value = Number(amountInput.value);
    const valid = Number.isSafeInteger(value) && value >= 1 && value <= 5000;
    $('#bet').textContent = valid ? `下注 ${format(value)}` : '下注';
    document.querySelectorAll('[data-amount]').forEach(node => node.setAttribute('aria-pressed', String(Number(node.dataset.amount) === value)));
    const breakdown = $('#breakdown');
    breakdown.replaceChildren();
    if (!valid) { breakdown.textContent = '输入 1–5,000 的整数'; return; }
    const chips = decompose(value), groups = values.filter(v => chips.includes(v));
    breakdown.append('筹码 ');
    groups.forEach((v, i) => {
      if (i) breakdown.append(' + ');
      const text = document.createElement('b');
      const n = chips.filter(c => c === v).length;
      text.textContent = n > 1 ? `${v} × ${n}` : String(v);
      breakdown.append(text);
    });
    const count = document.createElement('span'); count.textContent = `（${chips.length} 枚）`; breakdown.append(count);
  }
  async function fly(value, source, index, run) {
    const target = reserveChip(value);
    const from = source;
    const to = target.getBoundingClientRect(), bounds = stage.getBoundingClientRect();
    const x1 = from.x + from.width / 2 - bounds.x, y1 = from.y + from.height / 2 - bounds.y;
    const x2 = to.x + to.width / 2 - bounds.x, y2 = to.y + to.height / 2 - bounds.y;
    const flight = chip(value);
    flight.classList.add('flight'); flight.style.left = '0'; flight.style.top = '0';
    stage.append(flight);
    const transform = (x, y, turn = 0, scale = 1) => `translate(${x}px,${y}px) translate(-50%,-50%) rotateX(44deg) rotateZ(${turn}deg) scale(${scale})`;
    const animation = flight.animate([
      {transform: transform(x1, y1, 0, from.width / target.offsetWidth), opacity: 1, offset: 0},
      {transform: transform(x1 + (x2-x1)*.16, y1 + (y2-y1)*.16 - 16, 4, 1.06), opacity: 1, offset: .18},
      {transform: transform(x1 + (x2-x1)*.62, y1 + (y2-y1)*.62 - 38, 20, 1.08), opacity: 1, offset: .58},
      {transform: transform(x2, y2, Number(target.dataset.turn)), opacity: 1, offset: 1}
    ], {duration: reduced.matches ? 1 : 590, delay: reduced.matches ? 0 : index * 48, easing: 'cubic-bezier(.22,.65,.3,1)', fill: 'both'});
    animations.add(animation);
    try {
      await animation.finished;
      if (generation !== run) return;
      target.style.visibility = 'visible'; target.classList.add('landed'); updateTotal(value);
    } catch (error) {
      if (error.name !== 'AbortError') throw error;
    } finally { animations.delete(animation); animation.cancel(); flight.remove(); }
  }
  async function wager(seat, amount, run) {
    if (generation !== run) return;
    const plan = planBet(balances[seat], amount);
    // Exchange large denominations for exact change, then measure the actual outgoing chips.
    const bank = renderBank(seat, [...plan.kept, ...plan.outgoing]);
    const sources = new Map(values.map(value => [value, [...bank.querySelectorAll(`[data-value="${value}"]`)]]));
    const transfers = plan.outgoing.map(value => ({value,source:sources.get(value).pop().getBoundingClientRect()}));
    balances[seat] = plan.remaining;
    renderBank(seat, plan.kept);
    seats[seat].querySelector('.balance').textContent = format(balances[seat]);
    seats[seat].dataset.active = 'true';
    seats[seat].querySelector('.receipt').textContent = `下注 ${format(amount)}`;
    const name = seats[seat].querySelector('.name').textContent;
    status(`${name}下注 ${format(amount)}`);
    await Promise.all(transfers.map(({value,source}, index) => fly(value, source, index, run)));
    if (generation !== run) return;
    seats[seat].dataset.active = 'false';
    status(`${name}的筹码已入池`);
  }
  function reset(initial = false) {
    generation++;
    animations.forEach(animation => animation.cancel()); animations.clear();
    stage.querySelectorAll('.flight').forEach(node => node.remove());
    pile.replaceChildren(); total = 0; counts = {}; potStacks = []; balances = initial ? [4990,4990,4990] : [5000,5000,5000];
    seats.forEach((node,i) => { node.dataset.active = 'false'; node.querySelector('.balance').textContent = format(balances[i]); node.querySelector('.receipt').textContent = initial ? '已下注 10' : '等待下注'; });
    seats.forEach((_,seat) => renderBank(seat));
    if (initial) for (let i = 0; i < 3; i++) { const node = reserveChip(10); node.style.visibility = 'visible'; total += 10; }
    $('#pot-amount').textContent = format(total); pile.setAttribute('aria-label', `底池 ${total}`);
    setBusy(false); status(initial ? '准备下注' : '底池已清空');
  }
  async function execute(task) {
    if (busy) return;
    const run = generation; setBusy(true);
    try { await task(run); }
    catch (error) { if (generation === run) status(error.message || '演示失败，请重置后重试', true); }
    finally { if (generation === run) setBusy(false); }
  }
  $('#bet-form').addEventListener('submit', event => { event.preventDefault(); execute(run => wager(Number($('#player').value), Number(amountInput.value), run)); });
  amountInput.addEventListener('input', preview);
  document.querySelectorAll('[data-amount]').forEach(node => node.addEventListener('click', () => { amountInput.value = node.dataset.amount; preview(); }));
  $('#reset').addEventListener('click', () => reset());
  $('#demo').addEventListener('click', () => {
    reset();
    execute(async run => {
      const sequence = [[0,10],[1,10],[2,5],[0,5],[1,5],[2,100],[0,100],[1,100],[2,100],[0,100],[2,501]];
      for (const [seat,amount] of sequence) {
        if (generation !== run) return;
        amountInput.value = String(amount); $('#player').value = String(seat); preview();
        await wager(seat,amount,run);
        if (!reduced.matches) await new Promise(resolve => setTimeout(resolve,420));
      }
      if (generation === run) status(`演示完成 · 底池 ${format(total)}`);
    });
  });
  for (const value of [...values].reverse()) {
    const item = document.createElement('span'); item.className = 'legend-item';
    item.append(chip(value), document.createTextNode(String(value))); $('#legend').append(item);
  }
  reset(true); preview();
})();
</script>
</body>
</html>
