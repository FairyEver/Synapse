name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop-macos:
    name: Desktop macOS typecheck + tests + hard-constraints
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Run tests
        run: pnpm --filter @synapse/desktop run test
      - name: Verify IPC codegen drift
        run: pnpm --filter @synapse/desktop run check:ipc-codegen
      - name: Verify Phase 0 hard constraints
        run: pnpm --filter @synapse/desktop run check:hard-constraints

  desktop-windows:
    name: Desktop Windows typecheck + package
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Package Windows installer
        run: pnpm --filter @synapse/desktop run package:win:compiled
