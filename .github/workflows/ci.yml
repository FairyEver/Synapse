name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  desktop:
    name: Desktop typecheck + tests + hard-constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - name: Free Linux runner disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Run tests
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pnpm --filter @synapse/desktop run test
      - name: Verify IPC codegen drift
        run: pnpm --filter @synapse/desktop run check:ipc-codegen
      - name: Verify Phase 0 hard constraints
        run: pnpm --filter @synapse/desktop run check:hard-constraints

  desktop-windows:
    name: Desktop Windows typecheck + package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Package Windows installer
        run: pnpm --filter @synapse/desktop run package:win:compiled
