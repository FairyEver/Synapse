name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  script-runtime-contract:
    name: Script runtime ${{ matrix.label }} ${{ matrix.evidence }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            evidence: packaged artifact + runtime smoke
            packaged: true
          - label: Windows
            os: windows-2022
            evidence: packaged artifact + runtime smoke
            packaged: true
          - label: Linux
            os: ubuntu-latest
            evidence: runtime smoke
            packaged: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Verify JavaScript and Node.js surfaces
        run: pnpm --filter @synapse/desktop run check:script-runtime:surface
      - name: Run macOS or Windows runtime smoke
        if: runner.os != 'Linux'
        run: pnpm --filter @synapse/desktop run check:script-runtime:runtime-smoke:built
      - name: Run Linux runtime smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @synapse/desktop exec electron --no-sandbox scripts/checks/script-runtime-app
      - name: Build unsigned macOS packaged directory
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @synapse/desktop exec electron-builder --mac dir --arm64 --publish never
      - name: Build Windows packaged directory
        if: runner.os == 'Windows'
        run: pnpm --filter @synapse/desktop exec electron-builder --win dir --x64 --publish never
      - name: Run packaged artifact smoke
        if: matrix.packaged
        run: pnpm --filter @synapse/desktop run check:script-runtime:packaged

  desktop-macos:
    name: Desktop macOS typecheck + tests + hard-constraints
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Run tests
        run: pnpm --filter @synapse/desktop run test
      - name: Run Portal Headless client contracts
        run: node --test desktop/tests/portal-headless-client.test.mjs
      - name: Run local service shutdown contracts
        run: node --test scripts/__tests__/quit-server.test.mjs scripts/__tests__/run-server-with-env.test.mjs scripts/__tests__/quit-processes.test.mjs
      - name: Verify IPC codegen drift
        run: pnpm --filter @synapse/desktop run check:ipc-codegen
      - name: Verify Phase 0 hard constraints
        run: pnpm --filter @synapse/desktop run check:hard-constraints
      # Wired in on 2026-09-16, long after the check itself was written. Until then it was a
      # command someone could run by hand and nobody did: it first went red on 2026-09-04, when
      # a renderer file was added three days *after* the check existed, and stayed red for
      # twelve days without anyone noticing. The two checks above are in CI and have never
      # drifted; this one was not, and did.
      - name: Verify UI tracking coverage
        run: pnpm --filter @synapse/desktop run check:ui-tracking-coverage

  desktop-windows:
    name: Desktop Windows typecheck + Agent/Git tests + package
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "pull/${{ github.event.pull_request.number }}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @synapse/desktop run typecheck
      - name: Configure native SDK Git Bash
        shell: pwsh
        run: |
          $gitBash = "C:\Program Files\Git\bin\bash.exe"
          if (!(Test-Path $gitBash)) { throw "Native SDK Git Bash is missing" }
          "CLAUDE_CODE_GIT_BASH_PATH=$gitBash" >> $env:GITHUB_ENV
      - name: Run native Agent continuation and cross-platform contracts
        run: pnpm --filter @synapse/desktop run test:agent:cross-platform
      # Wired in on 2026-09-20. Attachments had no Windows coverage at all before that, and it
      # cost a user every image they tried to add: the staging path fsyncs the file it just
      # wrote, and Windows only allows that through a writable handle. macOS CI stayed green
      # for the whole time because POSIX allows fsyncing a read-only descriptor.
      - name: Run Agent attachment tests
        run: pnpm --filter @synapse/desktop exec vitest run electron/services/agent-runtime/__tests__/attachment-staging-service.test.ts electron/services/agent-runtime/__tests__/attachment-staging-fsync-contract.test.ts electron/modules/agent/__tests__/ipc.test.ts src/modules/agent/__tests__/agent-composer.test.tsx
      - name: Run local service shutdown contracts
        run: node --test scripts/__tests__/quit-server.test.mjs scripts/__tests__/run-server-with-env.test.mjs scripts/__tests__/quit-processes.test.mjs
      - name: Run Git unit and integration tests
        run: pnpm --filter @synapse/desktop exec vitest run electron/services/git-client electron/modules/git src/modules/git
      - name: Build desktop
        run: pnpm --filter @synapse/desktop run build
      - name: Package Windows installer
        run: pnpm --filter @synapse/desktop run package:win:compiled
