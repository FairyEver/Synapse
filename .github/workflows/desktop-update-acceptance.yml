name: Desktop update acceptance
run-name: ${{ inputs.mode == 'observer' && 'Windows process and version observer diagnostics' || inputs.mode == 'previous-startup' && 'Windows previous installed app startup diagnostics' || inputs.mode == 'candidate-runtime' && 'Windows packaged script runtime diagnostics' || inputs.mode == 'candidate-installed' && 'Windows installed candidate diagnostics' || 'Windows installed update acceptance' }}

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Published Windows version to install before the candidate
        required: true
        default: v1.0.79
        type: string
      mode:
        description: Full update acceptance or a diagnostic stage
        required: false
        default: full
        type: choice
        options:
          - full
          - observer
          - previous-startup
          - candidate-runtime
          - candidate-installed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-native-update:
    name: Windows installed app, native update, PTY and script runtime
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      SYNAPSE_DESKTOP_PUBLIC_APP_URL: https://synapse.d2.pub
      SYNAPSE_DESKTOP_REQUIRE_PUBLIC_APP_URL: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v10-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v10-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test acceptance metadata and installer integrity gates
        run: node --test desktop/scripts/checks/__tests__/windows-update-acceptance.test.mjs desktop/scripts/checks/__tests__/windows-installer-observer.test.mjs
      - name: Verify Windows process and version observation before installation
        if: ${{ inputs.mode != 'candidate-runtime' }}
        run: node desktop/scripts/checks/windows-update-acceptance.mjs --observe-processes
      - name: Build candidate
        if: ${{ inputs.mode == 'full' || inputs.mode == 'candidate-runtime' || inputs.mode == 'candidate-installed' }}
        run: pnpm --filter @synapse/desktop run build
      - name: Package candidate Windows installer without publishing
        if: ${{ inputs.mode == 'full' || inputs.mode == 'candidate-installed' }}
        run: pnpm --filter @synapse/desktop run package:win:compiled
      - name: Package candidate runtime without an installer
        if: ${{ inputs.mode == 'candidate-runtime' }}
        run: pnpm --filter @synapse/desktop exec electron-builder --win dir --x64 --publish never
      - name: Diagnose packaged candidate script runtime without installation
        if: ${{ inputs.mode == 'candidate-runtime' }}
        shell: bash
        run: |
          mkdir -p desktop/release/windows-update-acceptance
          set -o pipefail
          pnpm --filter @synapse/desktop run check:script-runtime:packaged 2>&1 | tee desktop/release/windows-update-acceptance/candidate-script-runtime.log
      - name: Diagnose previous installed app startup without building a candidate
        if: ${{ inputs.mode == 'previous-startup' }}
        run: node desktop/scripts/checks/windows-update-acceptance.mjs --previous-startup-only
      - name: Diagnose installed candidate without a cross-version update
        if: ${{ inputs.mode == 'candidate-installed' }}
        run: node desktop/scripts/checks/windows-update-acceptance.mjs --candidate-installed-only
      - name: Verify actual installed cross-version update
        if: ${{ inputs.mode == 'full' }}
        run: node desktop/scripts/checks/windows-update-acceptance.mjs
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-acceptance-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: desktop/release/windows-update-acceptance/
          if-no-files-found: warn
          retention-days: 7
