name: Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_REPO: FairyEver/SynapseAppRelease

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-installers:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    env:
      SYNAPSE_DESKTOP_PUBLIC_APP_URL: https://synapse.d2.pub
      SYNAPSE_DESKTOP_REQUIRE_PUBLIC_APP_URL: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            package_script: package:mac:compiled
          - label: Windows
            os: windows-latest
            package_script: package:win:compiled
    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Prepare Apple notarization key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @synapse/shared run build

      - name: Generate deployment config
        run: pnpm --filter @synapse/desktop run generate:deployment-config

      - name: Generate definitions registry
        run: pnpm --filter @synapse/desktop run generate:definitions-registry

      - name: Build renderer
        run: pnpm --filter @synapse/desktop run build:renderer

      - name: Build Electron process
        run: pnpm --filter @synapse/desktop run build:electron

      - name: Build database bundles
        run: pnpm --filter @synapse/desktop run build:database

      - name: Package macOS installer
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
        run: pnpm --filter @synapse/desktop run ${{ matrix.package_script }}

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @synapse/desktop run ${{ matrix.package_script }}

      - name: Verify packaged app
        run: pnpm --filter @synapse/desktop run check:packaged-asar

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          for file in desktop/release/*.dmg desktop/release/*.zip desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest*.yml; do
            cp "$file" release-artifacts/
          done

          ls -la release-artifacts
          test -n "$(ls -A release-artifacts)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    runs-on: macos-latest
    needs: build-installers
    env:
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
      TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
      TENCENT_CLOUD_COS_BUCKET: synapse-desktop-release-1252371654
      TENCENT_CLOUD_COS_REGION: ap-beijing
      TENCENT_CLOUD_COS_ENDPOINT: cos.accelerate.myqcloud.com
      TENCENT_CLOUD_CDN_DOMAIN: desktop.release.synapse.d2.pub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Install publish dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Prepare CDN release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CDN_BASE_URL: https://${{ env.TENCENT_CLOUD_CDN_DOMAIN }}/
        run: |
          cd desktop
          pnpm exec node scripts/release/prepare-cdn-release-artifacts.mjs \
            --artifacts-dir ../release-artifacts \
            --out-dir ../cdn-release \
            --version "$VERSION" \
            --cdn-base-url "$CDN_BASE_URL"
          find ../cdn-release -maxdepth 2 -type f | sort

      - name: Install COSCLI
        env:
          COSCLI_SHA256: df0018fbf78b552cbe875ebe26e8bdf7938c7f4394959f913dfc2ea4d1252568
          COSCLI_VERSION: v1.0.8
        run: |
          set -euo pipefail
          COSCLI_NAME="coscli-${COSCLI_VERSION}-darwin-arm64"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$COSCLI_NAME" \
            "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/${COSCLI_NAME}"
          printf '%s  %s\n' "$COSCLI_SHA256" "$RUNNER_TEMP/$COSCLI_NAME" | shasum -a 256 --check -
          install -m 0755 "$RUNNER_TEMP/$COSCLI_NAME" "$RUNNER_TEMP/coscli"
          "$RUNNER_TEMP/coscli" --version

      - name: Upload release artifacts to COS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          COS_CONFIG="$RUNNER_TEMP/cos.yaml"
          {
            printf '%s\n' 'cos:'
            printf '%s\n' '  base:'
            printf '    secretid: %s\n' "$TENCENT_CLOUD_SECRET_ID"
            printf '    secretkey: %s\n' "$TENCENT_CLOUD_SECRET_KEY"
            printf '%s\n' '    sessiontoken: ""'
            printf '%s\n' '    protocol: https'
            printf '%s\n' '  buckets:'
            printf '    - name: %s\n' "$TENCENT_CLOUD_COS_BUCKET"
            printf '%s\n' '      alias: release'
            printf '      region: %s\n' "$TENCENT_CLOUD_COS_REGION"
            printf '      endpoint: %s\n' "$TENCENT_CLOUD_COS_ENDPOINT"
            printf '%s\n' '      ofs: false'
          } > "$COS_CONFIG"

          COSCLI_UPLOAD_FLAGS=(--part-size 16 --thread-num 16 --routines 4 --err-retry-num 3 --err-retry-interval 3)

          "$RUNNER_TEMP/coscli" cp "cdn-release/v$VERSION/" "cos://release/v$VERSION/" -r -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"
          "$RUNNER_TEMP/coscli" cp "cdn-release/latest.yml" "cos://release/latest.yml" -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"
          "$RUNNER_TEMP/coscli" cp "cdn-release/latest-windows.yml" "cos://release/latest-windows.yml" -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"
          "$RUNNER_TEMP/coscli" cp "cdn-release/latest-mac.yml" "cos://release/latest-mac.yml" -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"
          "$RUNNER_TEMP/coscli" cp "cdn-release/manifest.json" "cos://release/v$VERSION/manifest.json" -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"
          "$RUNNER_TEMP/coscli" cp "cdn-release/release-body.md" "cos://release/v$VERSION/release-body.md" -c "$COS_CONFIG" "${COSCLI_UPLOAD_FLAGS[@]}"

      - name: Refresh and verify CDN
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ap-guangzhou
        run: |
          set -euo pipefail

          python -m pip install --user tccli
          PY_USER_BASE="$(python -m site --user-base)"
          echo "$PY_USER_BASE/bin" >> "$GITHUB_PATH"
          export PATH="$PY_USER_BASE/bin:$PATH"

          CDN_REFRESH_URLS=$(node -e "console.log(JSON.stringify(['https://${TENCENT_CLOUD_CDN_DOMAIN}/latest.yml', 'https://${TENCENT_CLOUD_CDN_DOMAIN}/latest-windows.yml', 'https://${TENCENT_CLOUD_CDN_DOMAIN}/latest-mac.yml']))")
          tccli cdn PurgeUrlsCache --Urls "$CDN_REFRESH_URLS" --Area mainland

          verify_cdn_head() {
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --head \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 4 \
              --retry-delay 5 \
              --retry-all-errors \
              "$1"
          }

          verify_cdn_head "https://${TENCENT_CLOUD_CDN_DOMAIN}/latest.yml"
          verify_cdn_head "https://${TENCENT_CLOUD_CDN_DOMAIN}/latest-windows.yml"
          verify_cdn_head "https://${TENCENT_CLOUD_CDN_DOMAIN}/latest-mac.yml"

          while IFS= read -r url; do
            verify_cdn_head "$url"
          done < <(node -e "const manifest=require('./cdn-release/manifest.json'); for (const url of manifest.assetUrls) console.log(url)")

      - name: Publish release notes
        env:
          RELEASE_NAME: Synapse v${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file cdn-release/release-body.md --repo "$RELEASE_REPO"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file cdn-release/release-body.md --repo "$RELEASE_REPO"
          fi

  notify:
    name: Notify package completion
    runs-on: macos-latest
    needs: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false

      - name: Send notification
        continue-on-error: true
        timeout-minutes: 1
        env:
          BARK_PUSH_URL: ${{ secrets.BARK_PUSH_URL }}
        run: |
          if [ -z "$BARK_PUSH_URL" ]; then
            echo "BARK_PUSH_URL secret is not configured; skip notification."
            exit 0
          fi

          PRODUCT_NAME="$(node -p "require('./desktop/package.json').productName || require('./desktop/package.json').name")"
          TIMESTAMP="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"

          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            -X POST "$BARK_PUSH_URL" \
            --data-urlencode "title=$PRODUCT_NAME" \
            --data-urlencode "subtitle=$TIMESTAMP" \
            --data-urlencode "body=打包完成"
