name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - package.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-installers:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            artifact_name: release-macos
            package_script: package:mac
          - label: Windows
            os: windows-latest
            artifact_name: release-windows
            package_script: package:win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Electron process
        run: pnpm build:electron

      - name: Package installer
        run: pnpm ${{ matrix.package_script }}

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml; do
            cp "$file" release-artifacts/
          done

          ls -la release-artifacts
          test -n "$(ls -A release-artifacts)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          node scripts/release.mjs notes "${{ steps.version.outputs.version }}" > release-notes.md
          test -s release-notes.md

      - name: Verify release tag target
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          tag_object="$(gh api "$tag_ref" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)"

          if [ -z "$tag_object" ]; then
            exit 0
          fi

          read -r tag_type tag_sha <<<"$tag_object"

          if [ "$tag_type" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi

          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag ${RELEASE_TAG} already points to ${tag_sha}, not ${GITHUB_SHA}."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          RELEASE_NAME: Synapse v${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t files < <(find release-artifacts -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_NAME" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
