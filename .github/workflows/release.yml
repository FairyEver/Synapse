name: Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-installers:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            artifact_name: release-macos
            package_script: package:mac
          - label: Windows
            os: windows-latest
            artifact_name: release-windows
            package_script: package:win
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build:renderer

      - name: Build Electron process
        run: pnpm build:electron

      - name: Validate macOS signing secrets
        if: runner.os == 'macOS'
        run: |
          for secret_name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required macOS release secret: $secret_name"
              exit 1
            fi
          done

      - name: Package installer
        run: pnpm ${{ matrix.package_script }}

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          APP_PATH="$(find release -path '*/Synapse.app' -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "Built app bundle not found."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee /tmp/synapse-codesign.txt

          if ! grep -q "^Authority=Developer ID Application:" /tmp/synapse-codesign.txt; then
            echo "Expected a Developer ID Application signature for macOS release builds."
            exit 1
          fi

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/latest*.yml; do
            cp "$file" release-artifacts/
          done

          ls -la release-artifacts
          test -n "$(ls -A release-artifacts)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          RELEASE_NAME: Synapse v${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t files < <(find release-artifacts -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_NAME" --generate-notes
          fi
