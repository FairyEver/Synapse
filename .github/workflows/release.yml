name: Release

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_REPO: FairyEver/SynapseAppRelease

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-installers:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            artifact_name: release-macos
            package_script: package:mac
          - label: Windows
            os: windows-latest
            artifact_name: release-windows
            package_script: package:win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare Apple notarization key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter @synapse/desktop run build:renderer

      - name: Build Electron process
        run: pnpm --filter @synapse/desktop run build:electron

      - name: Build database bundles
        run: pnpm --filter @synapse/desktop run build:database

      - name: Package macOS installer
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
        run: pnpm --filter @synapse/desktop run ${{ matrix.package_script }}

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @synapse/desktop run ${{ matrix.package_script }}

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          for file in desktop/release/*.dmg desktop/release/*.zip desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest*.yml; do
            cp "$file" release-artifacts/
          done

          ls -la release-artifacts
          test -n "$(ls -A release-artifacts)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers
    env:
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          RELEASE_NAME: Synapse v${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t files < <(find release-artifacts -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$RELEASE_REPO"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_NAME" --generate-notes --repo "$RELEASE_REPO"
          fi

      - name: Notify package completion
        env:
          BARK_PUSH_URL: https://api.day.app/B3H8T6rF2p5Mj6z6oha82K
        run: |
          PRODUCT_NAME="$(node -p "require('./desktop/package.json').productName || require('./desktop/package.json').name")"
          TIMESTAMP="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"

          curl --fail --silent --show-error \
            -X POST "$BARK_PUSH_URL" \
            --data-urlencode "title=$PRODUCT_NAME" \
            --data-urlencode "subtitle=$TIMESTAMP" \
            --data-urlencode "body=打包完成"
