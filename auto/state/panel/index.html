<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse 夜间巡检监控面板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #09090b; --surface: #18181b; --surface2: #27272a;
    --border: #3f3f46; --text: #fafafa; --dim: #a1a1aa; --dim2: #71717a;
    --blue: #3b82f6; --blue-bg: #172554;
    --green: #22c55e; --green-bg: #14532d;
    --orange: #f59e0b; --orange-bg: #78350f;
    --red: #ef4444; --red-bg: #7f1d1d;
    --purple: #a855f7; --purple-bg: #3b0764;
    --cyan: #06b6d4; --cyan-bg: #164e63;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
  
  /* Layout */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 50; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--dim); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s ease infinite; }
  .status-dot.waiting { background: var(--orange); }
  .status-dot.offline { background: var(--dim2); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  
  .main { display: grid; grid-template-columns: 1fr 1fr 340px; grid-template-rows: auto auto 1fr; gap: 1px; background: var(--border); min-height: calc(100vh - 49px); }
  .panel { background: var(--bg); padding: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .panel-title { font-size: 11px; font-weight: 600; color: var(--dim2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .panel-count { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  
  /* Stats bar */
  .stats-bar { grid-column: 1 / -1; display: flex; gap: 1px; background: var(--border); }
  .stat-item { flex: 1; background: var(--bg); padding: 14px 16px; display: flex; flex-direction: column; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 11px; color: var(--dim2); margin-top: 2px; }
  .stat-sub { font-size: 11px; color: var(--dim); margin-top: 4px; }
  
  /* Agent grid */
  .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; transition: all 0.3s; }
  .agent-card.fixing { border-color: var(--green); }
  .agent-card.scouting { border-color: var(--cyan); }
  .agent-card.waiting { border-color: var(--orange); opacity: 0.7; }
  .agent-card.idle { opacity: 0.4; }
  .agent-id { font-size: 11px; font-weight: 700; font-family: monospace; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-info { font-size: 11px; color: var(--dim); }
  .agent-status { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px; margin-top: 4px; }
  .agent-status.fixing { background: var(--green-bg); color: var(--green); }
  .agent-status.scouting { background: var(--cyan-bg); color: var(--cyan); }
  .agent-status.waiting { background: var(--orange-bg); color: var(--orange); }
  .agent-status.idle { background: var(--surface2); color: var(--dim2); }
  
  /* Backlog */
  .backlog-stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .backlog-stat { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .backlog-list { flex: 1; overflow-y: auto; }
  .backlog-item { padding: 8px 10px; border-radius: 6px; background: var(--surface); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .backlog-item .priority { width: 24px; height: 18px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .backlog-item .priority.p0 { background: var(--red-bg); color: var(--red); }
  .backlog-item .priority.p1 { background: var(--orange-bg); color: var(--orange); }
  .backlog-item .priority.p2 { background: var(--blue-bg); color: var(--blue); }
  .backlog-item .priority.p3 { background: var(--purple-bg); color: var(--purple); }
  .backlog-item .summary { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .backlog-item .badge { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
  .badge-open { background: var(--blue-bg); color: var(--blue); }
  .badge-claimed { background: var(--orange-bg); color: var(--orange); }
  .badge-fixed { background: var(--green-bg); color: var(--green); }
  .badge-wontfix { background: var(--surface2); color: var(--dim2); }
  
  /* Distribution bars */
  .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dist-label { width: 56px; font-size: 11px; color: var(--dim); text-align: right; flex-shrink: 0; }
  .dist-bar-bg { flex: 1; height: 18px; background: var(--surface); border-radius: 3px; overflow: hidden; }
  .dist-bar { height: 100%; border-radius: 3px; transition: width 0.6s ease; min-width: 0; }
  .dist-value { width: 28px; font-size: 11px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  
  /* Timeline */
  .timeline-panel { grid-row: 2 / 4; }
  .timeline-list { flex: 1; overflow-y: auto; }
  .timeline-item { padding: 8px 0; border-bottom: 1px solid var(--surface2); font-size: 12px; }
  .timeline-time { font-size: 10px; color: var(--dim2); font-family: monospace; }
  .timeline-agent { font-size: 10px; font-weight: 600; color: var(--dim); }
  .timeline-event { margin-top: 2px; color: var(--dim); }
  .timeline-event .ev-fix { color: var(--green); font-weight: 500; }
  .timeline-event .ev-scout { color: var(--cyan); font-weight: 500; }
  .timeline-event .ev-lock { color: var(--red); font-weight: 500; }
  .timeline-event .ev-claim { color: var(--orange); font-weight: 500; }
  .timeline-event .ev-release { color: var(--blue); font-weight: 500; }
  
  /* Recent fixes */
  .fix-item { padding: 10px 12px; background: var(--surface); border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--green); }
  .fix-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .fix-time { font-size: 10px; color: var(--dim2); font-family: monospace; }
  .fix-agent { font-size: 10px; font-weight: 600; color: var(--dim); }
  .fix-summary { font-size: 12px; margin-bottom: 4px; }
  .fix-meta { font-size: 11px; color: var(--dim2); }
  .fix-files { font-size: 11px; color: var(--dim); font-family: monospace; margin-top: 4px; }
  
  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--dim2); text-align: center; flex: 1; }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state .msg { font-size: 13px; }
  .empty-state .sub { font-size: 11px; margin-top: 4px; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }
  
  /* Refresh indicator */
  .refresh-bar { height: 2px; background: var(--surface); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
  .refresh-progress { height: 100%; background: var(--blue); transition: width 0.1s linear; width: 0%; }
  
  @media (max-width: 1000px) {
    .main { grid-template-columns: 1fr 1fr; }
    .timeline-panel { grid-column: 1 / -1; grid-row: auto; max-height: 400px; }
  }
  @media (max-width: 600px) {
    .main { grid-template-columns: 1fr; }
    .stats-bar { flex-wrap: wrap; }
    .stat-item { min-width: 33%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Synapse 夜间巡检监控</h1>
  </div>
  <div class="header-right">
    <span id="dataStatus"><span class="status-dot waiting"></span> 等待数据</span>
    <span id="refreshLabel">刷新间隔: 10s</span>
    <span id="uptimeLabel">运行时长: --</span>
    <span id="lastUpdateLabel">更新: --</span>
  </div>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-item">
    <div class="stat-value" id="sTotalRounds" style="color:var(--text)">--</div>
    <div class="stat-label">总轮次</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sTotalFixes" style="color:var(--green)">--</div>
    <div class="stat-label">有效修复</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sTotalScouts" style="color:var(--cyan)">--</div>
    <div class="stat-label">侦察轮</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sBacklog" style="color:var(--orange)">--</div>
    <div class="stat-label">积压池</div>
    <div class="stat-sub" id="sBacklogDetail"></div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sAgents" style="color:var(--blue)">--</div>
    <div class="stat-label">活跃 Agent</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sConflicts" style="color:var(--red)">--</div>
    <div class="stat-label">锁冲突</div>
  </div>
</div>

<div class="main">
  <!-- Agent Grid + Backlog -->
  <div class="panel">
    <div class="panel-title">Agent 状态 <span class="panel-count" id="agentCount">0</span></div>
    <div class="agent-grid" id="agentGrid"></div>
    
    <div class="panel-title" style="margin-top:20px">方向分布</div>
    <div id="dirBars"></div>
    
    <div class="panel-title" style="margin-top:16px">修复类型</div>
    <div id="typeBars"></div>
  </div>
  
  <!-- Recent Fixes + Backlog -->
  <div class="panel" style="overflow-y:auto">
    <div class="panel-title">最近修复 <span class="panel-count" id="fixCount">0</span></div>
    <div id="fixList"></div>
    
    <div class="panel-title" style="margin-top:20px">积压池 <span class="panel-count" id="backlogCount">0</span></div>
    <div id="backlogList" class="backlog-list"></div>
  </div>
  
  <!-- Timeline -->
  <div class="panel timeline-panel">
    <div class="panel-title">事件流 <span class="panel-count" id="timelineCount">0</span></div>
    <div class="timeline-list" id="timelineList"></div>
  </div>
</div>

<div class="refresh-bar"><div class="refresh-progress" id="refreshProgress"></div></div>

<script>
// ========== Data Loading ==========
const REFRESH_INTERVAL = 10000;
let lastData = null;
let refreshTimer = null;
let progressTimer = null;

function loadData() {
  // Remove old script if exists
  const old = document.getElementById('dataScript');
  if (old) old.remove();
  
  // Reset global
  window.PANEL_DATA = null;
  
  const s = document.createElement('script');
  s.id = 'dataScript';
  s.src = 'data.js?_=' + Date.now();
  s.onload = function() {
    if (window.PANEL_DATA) {
      lastData = window.PANEL_DATA;
      render(lastData);
      updateStatus('live', '数据已连接');
    } else {
      updateStatus('waiting', '数据文件为空');
    }
  };
  s.onerror = function() {
    updateStatus('offline', '无法加载 data.js');
    if (!lastData) renderEmpty();
  };
  document.head.appendChild(s);
  
  startProgressBar();
}

function updateStatus(state, text) {
  const el = document.getElementById('dataStatus');
  el.innerHTML = `<span class="status-dot ${state}"></span> ${text}`;
}

function startProgressBar() {
  const bar = document.getElementById('refreshProgress');
  bar.style.width = '0%';
  let p = 0;
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    p += 100 / (REFRESH_INTERVAL / 100);
    bar.style.width = Math.min(p, 100) + '%';
    if (p >= 100) clearInterval(progressTimer);
  }, 100);
}

// ========== Rendering ==========
function render(d) {
  if (!d) return;
  const s = d.stats || {};
  
  // Header info
  if (d.lastUpdated) {
    const t = new Date(d.lastUpdated);
    document.getElementById('lastUpdateLabel').textContent = '更新: ' + t.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  if (d.startTime) {
    const start = new Date(d.startTime);
    const now = new Date();
    const diff = now - start;
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    document.getElementById('uptimeLabel').textContent = `运行: ${h}h ${m}m`;
  }
  
  // Stats
  setText('sTotalRounds', s.totalRounds ?? '--');
  setText('sTotalFixes', s.totalFixes ?? '--');
  setText('sTotalScouts', s.totalScouts ?? '--');
  setText('sConflicts', s.totalConflicts ?? '--');
  
  const backlogTotal = (s.backlogOpen || 0) + (s.backlogClaimed || 0);
  setText('sBacklog', backlogTotal);
  setText('sBacklogDetail', `${s.backlogOpen || 0} open · ${s.backlogClaimed || 0} claimed · ${s.backlogFixed || 0} fixed`);
  
  const activeAgents = (d.agents || []).filter(a => a.status !== 'idle').length;
  setText('sAgents', activeAgents + '/' + (d.agents || []).length);
  
  // Agent Grid
  renderAgents(d.agents || []);
  
  // Direction bars
  renderDirBars(d.directionStats || {});
  
  // Type bars
  renderTypeBars(d.typeStats || {});
  
  // Recent fixes
  renderFixes(d.recentFixes || []);
  
  // Backlog
  renderBacklog(d.backlog || []);
  
  // Timeline
  renderTimeline(d.timeline || []);
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function renderEmpty() {
  document.getElementById('agentGrid').innerHTML = `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="icon">⏳</div>
      <div class="msg">等待 Agent 启动</div>
      <div class="sub">Agent 运行后会自动更新 data.js</div>
    </div>`;
  document.getElementById('fixList').innerHTML = `
    <div class="empty-state"><div class="icon">🔧</div><div class="msg">暂无修复记录</div></div>`;
  document.getElementById('timelineList').innerHTML = `
    <div class="empty-state"><div class="icon">📡</div><div class="msg">等待事件</div></div>`;
}

function renderAgents(agents) {
  const el = document.getElementById('agentGrid');
  setText('agentCount', agents.length);
  if (!agents.length) { el.innerHTML = '<div class="empty-state"><div class="icon">🤖</div><div class="msg">暂无 Agent</div></div>'; return; }
  
  el.innerHTML = agents.map(a => {
    const statusClass = a.status || 'idle';
    const statusText = { fixing: '修复中', scouting: '侦察中', waiting: '等待锁', idle: '空闲', scanning: '扫描中' }[statusClass] || statusClass;
    const shortId = (a.id || '').replace(/^agent-/, '').substring(0, 12);
    return `<div class="agent-card ${statusClass}">
      <div class="agent-id" title="${a.id || ''}">${shortId || '?'}</div>
      <div class="agent-info">轮次 ${a.iteration ?? '-'}</div>
      ${a.direction ? `<div class="agent-info">方向 ${a.direction}</div>` : ''}
      ${a.currentFile ? `<div class="agent-info" style="font-family:monospace;font-size:10px" title="${a.currentFile}">${basename(a.currentFile)}</div>` : ''}
      <div class="agent-status ${statusClass}">${statusText}</div>
    </div>`;
  }).join('');
}

function renderDirBars(dirs) {
  const el = document.getElementById('dirBars');
  const colors = { A: 'var(--blue)', B: 'var(--cyan)', C: 'var(--purple)', D: 'var(--orange)' };
  const entries = Object.entries(dirs);
  const maxFixes = Math.max(...entries.map(([,v]) => v.fixes || 0), 1);
  
  el.innerHTML = entries.map(([k, v]) => `
    <div class="dist-row">
      <div class="dist-label">${v.label || k}</div>
      <div class="dist-bar-bg"><div class="dist-bar" style="width:${((v.fixes||0)/maxFixes)*100}%;background:${colors[k]||'var(--dim)'}"></div></div>
      <div class="dist-value">${v.fixes || 0}</div>
    </div>`).join('');
}

function renderTypeBars(types) {
  const el = document.getElementById('typeBars');
  const colors = { crash: 'var(--red)', errorHandling: 'var(--orange)', deadCode: 'var(--dim)', uiQuality: 'var(--purple)', interaction: 'var(--cyan)' };
  const entries = Object.entries(types);
  const maxCount = Math.max(...entries.map(([,v]) => v.count || 0), 1);
  
  el.innerHTML = entries.map(([k, v]) => `
    <div class="dist-row">
      <div class="dist-label">${v.label || k}</div>
      <div class="dist-bar-bg"><div class="dist-bar" style="width:${((v.count||0)/maxCount)*100}%;background:${colors[k]||'var(--dim)'}"></div></div>
      <div class="dist-value">${v.count || 0}</div>
    </div>`).join('');
}

function renderFixes(fixes) {
  const el = document.getElementById('fixList');
  setText('fixCount', fixes.length);
  if (!fixes.length) { el.innerHTML = '<div class="empty-state"><div class="icon">🔧</div><div class="msg">暂无修复</div></div>'; return; }
  
  // Show latest 20
  const recent = fixes.slice(-20).reverse();
  el.innerHTML = recent.map(f => {
    const borderColors = { P0: 'var(--red)', P1: 'var(--orange)', P2: 'var(--blue)', P3: 'var(--purple)' };
    return `<div class="fix-item" style="border-left-color:${borderColors[f.priority] || 'var(--green)'}">
      <div class="fix-header">
        <span class="fix-agent">${shortAgent(f.agentId)} #${f.iteration ?? '?'}</span>
        <span class="fix-time">${formatTime(f.time)}</span>
      </div>
      <div class="fix-summary">${esc(f.summary || '')}</div>
      <div class="fix-meta">${f.priority || ''} · ${f.type || ''}</div>
      ${f.files ? `<div class="fix-files">${(f.files||[]).map(p => basename(p)).join(', ')}</div>` : ''}
    </div>`;
  }).join('');
}

function renderBacklog(items) {
  const el = document.getElementById('backlogList');
  setText('backlogCount', items.length);
  if (!items.length) { el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="msg">积压池为空</div></div>'; return; }
  
  // Sort: open first, then claimed, then fixed/wontfix
  const order = { open: 0, claimed: 1, fixed: 2, wontfix: 3 };
  const sorted = [...items].sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
  
  el.innerHTML = sorted.slice(0, 30).map(item => `
    <div class="backlog-item">
      <div class="priority ${(item.priority||'').toLowerCase()}">${item.priority || '?'}</div>
      <div class="summary" title="${esc(item.summary || '')}">${esc(item.summary || '')}</div>
      <div class="badge badge-${item.status || 'open'}">${item.status || 'open'}</div>
    </div>`).join('');
}

function renderTimeline(events) {
  const el = document.getElementById('timelineList');
  setText('timelineCount', events.length);
  if (!events.length) { el.innerHTML = '<div class="empty-state"><div class="icon">📡</div><div class="msg">等待事件</div></div>'; return; }
  
  // Show latest 100
  const recent = events.slice(-100).reverse();
  el.innerHTML = recent.map(e => {
    const typeClass = e.type || 'info';
    const typeSpan = `<span class="ev-${typeClass}">${e.event || ''}</span>`;
    return `<div class="timeline-item">
      <div><span class="timeline-time">${formatTime(e.time)}</span> <span class="timeline-agent">${shortAgent(e.agentId)}</span></div>
      <div class="timeline-event">${typeSpan}${e.detail ? ' — ' + esc(e.detail) : ''}</div>
    </div>`;
  }).join('');
}

// ========== Helpers ==========
function basename(p) { return (p || '').split('/').pop(); }
function shortAgent(id) { return (id || '').replace(/^agent-/, '').substring(0, 10); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatTime(t) {
  if (!t) return '--:--';
  try {
    const d = new Date(t);
    return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch { return t; }
}

// ========== Init ==========
loadData();
refreshTimer = setInterval(loadData, REFRESH_INTERVAL);
renderEmpty();
</script>
</body>
</html>
