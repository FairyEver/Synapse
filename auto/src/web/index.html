<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>auto</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <nav class="tabs" aria-label="页面">
        <button id="config-tab" class="tab active" type="button">配置</button>
        <button id="run-tab" class="tab" type="button">运行</button>
        <span id="scheduler-status" class="badge">idle</span>
      </nav>

      <section id="config-view" class="view active" aria-labelledby="config-title">
        <div class="config-layout">
          <section class="panel config-panel" aria-labelledby="config-title">
            <div class="panel-header">
              <h1 id="config-title">配置</h1>
              <p id="save-state" class="state-text"></p>
            </div>

            <div class="prompt-tools">
              <label class="field prompt-select-field">
                <span>提示词</span>
                <select id="activePromptName"></select>
              </label>
              <div class="prompt-actions" aria-label="提示词操作">
                <button id="new-prompt" class="button secondary" type="button">新建</button>
                <button id="rename-prompt" class="button secondary" type="button">重命名</button>
                <button id="delete-prompt" class="button secondary" type="button">删除</button>
              </div>
            </div>

            <label class="field span-all">
              <span>内容</span>
              <textarea id="prompt" rows="9" spellcheck="false"></textarea>
            </label>

            <dialog id="unsaved-dialog" class="dialog">
              <form method="dialog" class="dialog-body">
                <h2>未保存</h2>
                <div class="dialog-actions">
                  <button id="switch-save" class="button primary" value="save" type="submit">保存并切换</button>
                  <button id="switch-discard" class="button secondary" value="discard" type="submit">放弃修改</button>
                  <button class="button secondary" value="cancel" type="submit">取消</button>
                </div>
              </form>
            </dialog>

            <div class="grid">
              <label class="field span-all">
                <span>工作目录</span>
                <input id="workingDirectory" type="text">
              </label>

              <label class="field">
                <span>并行 Agent 数</span>
                <input id="concurrency" type="number" min="1" step="1">
              </label>

              <label class="field">
                <span>间隔分钟</span>
                <input id="intervalMinutes" type="number" min="1" step="1">
              </label>

              <label class="field">
                <span>超时分钟</span>
                <input id="timeoutMinutes" type="number" min="1" step="1">
              </label>

              <label class="field">
                <span>日志保留数</span>
                <input id="maxLogs" type="number" min="1" step="1">
              </label>

              <label class="field">
                <span>Codex 命令</span>
                <input id="codexCommand" type="text">
              </label>

              <label class="field">
                <span>模型</span>
                <input id="codexModel" type="text">
              </label>

              <label class="field span-half">
                <span>沙盒</span>
                <select id="codexSandbox">
                  <option value="danger-full-access">完全访问 danger-full-access</option>
                  <option value="workspace-write">工作区写入 workspace-write</option>
                  <option value="read-only">只读 read-only</option>
                </select>
              </label>

              <label class="field span-half">
                <span>审批策略</span>
                <select id="codexApprovalPolicy">
                  <option value="never">不询问 never</option>
                  <option value="on-request">按需询问 on-request</option>
                  <option value="untrusted">非信任命令询问 untrusted</option>
                  <option value="on-failure">失败后询问 on-failure</option>
                </select>
              </label>
            </div>
          </section>

          <aside class="panel action-panel" aria-label="操作">
            <button id="start" class="button primary" type="button">开始运行</button>
            <button id="save" class="button secondary" type="button">保存配置</button>
          </aside>
        </div>
      </section>

      <section id="run-view" class="view" aria-labelledby="status-title">
        <div class="run-layout">
          <section class="panel status-panel" aria-labelledby="status-title">
            <div class="panel-header">
              <h1 id="status-title">运行</h1>
            </div>

            <dl class="metrics">
              <div>
                <dt>批次</dt>
                <dd id="batch-id">-</dd>
              </div>
              <div>
                <dt>开始时间</dt>
                <dd id="batch-started">-</dd>
              </div>
              <div>
                <dt>汇总日志</dt>
                <dd id="summary-path">-</dd>
              </div>
            </dl>

            <div id="workers" class="workers"></div>
            <p id="error" class="error-text"></p>
          </section>

          <aside class="panel action-panel" aria-label="运行操作">
            <button id="stop-after-current" class="button secondary" type="button">本批结束后停止</button>
          </aside>
        </div>
      </section>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
