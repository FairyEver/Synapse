services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - synapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    restart: unless-stopped
    image: synapse-server:${SYNAPSE_SERVER_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      USER_ACCESS_JWT_SECRET: ${USER_ACCESS_JWT_SECRET:?USER_ACCESS_JWT_SECRET is required}
      DESKTOP_UPDATE_INTENT_SECRET: ${DESKTOP_UPDATE_INTENT_SECRET:?DESKTOP_UPDATE_INTENT_SECRET is required}
      USER_ACCESS_TOKEN_MINUTES: ${USER_ACCESS_TOKEN_MINUTES:-15}
      USER_REFRESH_TOKEN_DAYS: ${USER_REFRESH_TOKEN_DAYS:-30}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DRIVE_COS_SECRET_ID: ${DRIVE_COS_SECRET_ID:-}
      DRIVE_COS_SECRET_KEY: ${DRIVE_COS_SECRET_KEY:-}
      DRIVE_COS_BUCKET: ${DRIVE_COS_BUCKET:-}
      DRIVE_COS_REGION: ${DRIVE_COS_REGION:-}
      SKILL_REPOSITORY_COS_SECRET_ID: ${SKILL_REPOSITORY_COS_SECRET_ID:-}
      SKILL_REPOSITORY_COS_SECRET_KEY: ${SKILL_REPOSITORY_COS_SECRET_KEY:-}
      SKILL_REPOSITORY_COS_BUCKET: ${SKILL_REPOSITORY_COS_BUCKET:-}
      SKILL_REPOSITORY_COS_REGION: ${SKILL_REPOSITORY_COS_REGION:-}
      PLATFORM_MEDIA_COS_SECRET_ID: ${PLATFORM_MEDIA_COS_SECRET_ID:-}
      PLATFORM_MEDIA_COS_SECRET_KEY: ${PLATFORM_MEDIA_COS_SECRET_KEY:-}
      PLATFORM_MEDIA_COS_BUCKET: ${PLATFORM_MEDIA_COS_BUCKET:-}
      PLATFORM_MEDIA_COS_REGION: ${PLATFORM_MEDIA_COS_REGION:-}
      BACKUP_COS_SECRET_ID: ${BACKUP_COS_SECRET_ID:-}
      BACKUP_COS_SECRET_KEY: ${BACKUP_COS_SECRET_KEY:-}
      BACKUP_COS_BUCKET: ${BACKUP_COS_BUCKET:-}
      BACKUP_COS_REGION: ${BACKUP_COS_REGION:-}
      SYNAPSE_DRIVE_LOCAL_ROOT: /app/data/drive
      PORT: "3001"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
      - ./data/drive:/app/data/drive
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  synapse-postgres:
