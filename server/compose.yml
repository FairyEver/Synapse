services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: synapse
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - synapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD:-synapse}@postgres:5432/synapse
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      USER_ACCESS_JWT_SECRET: ${USER_ACCESS_JWT_SECRET:?USER_ACCESS_JWT_SECRET is required}
      USER_ACCESS_TOKEN_MINUTES: ${USER_ACCESS_TOKEN_MINUTES:-15}
      USER_REFRESH_TOKEN_DAYS: ${USER_REFRESH_TOKEN_DAYS:-30}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      PORT: "3001"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd server && npx prisma migrate deploy && cd .. && node server/dist/main.js & nginx -g 'daemon off;'"

volumes:
  synapse-postgres:
