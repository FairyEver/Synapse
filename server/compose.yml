services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: synapse
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - synapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    restart: unless-stopped
    image: synapse-server:${SYNAPSE_SERVER_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD:-synapse}@postgres:5432/synapse
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      USER_ACCESS_JWT_SECRET: ${USER_ACCESS_JWT_SECRET:?USER_ACCESS_JWT_SECRET is required}
      USER_ACCESS_TOKEN_MINUTES: ${USER_ACCESS_TOKEN_MINUTES:-15}
      USER_REFRESH_TOKEN_DAYS: ${USER_REFRESH_TOKEN_DAYS:-30}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DRIVE_COS_SECRET_ID: ${DRIVE_COS_SECRET_ID:-}
      DRIVE_COS_SECRET_KEY: ${DRIVE_COS_SECRET_KEY:-}
      DRIVE_COS_BUCKET: ${DRIVE_COS_BUCKET:-}
      DRIVE_COS_REGION: ${DRIVE_COS_REGION:-}
      BACKUP_COS_SECRET_ID: ${BACKUP_COS_SECRET_ID:-}
      BACKUP_COS_SECRET_KEY: ${BACKUP_COS_SECRET_KEY:-}
      BACKUP_COS_BUCKET: ${BACKUP_COS_BUCKET:-}
      BACKUP_COS_REGION: ${BACKUP_COS_REGION:-}
      SYNAPSE_DRIVE_LOCAL_ROOT: /app/data/drive
      PORT: "3001"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./data/drive:/app/data/drive
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  synapse-postgres:
