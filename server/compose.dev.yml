services:
  pdf-renderer:
    # 本地镜像由源码构建，不向 Docker Hub 查询 latest；缺少时 Compose 仍会构建。
    pull_policy: never
    ports:
      - "127.0.0.1:${PDF_RENDERER_HOST_PORT:-19702}:3010"
    networks:
      - pdf-internal
      - pdf-dev

networks:
  pdf-dev:
    driver: bridge

# Tunnel HTTP ingress runs on the host at 127.0.0.1:19703; no published container port.
