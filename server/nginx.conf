map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $binary_remote_addr zone=problem_feedback_network:1m rate=1r/m;
limit_req_zone $server_name zone=problem_feedback_global:1m rate=1r/m;

server {
  listen 3000;
  server_name _;
  absolute_redirect off;

  location = /desktop/update {
    root /app/dashboard/dist;
    if ($args != "") { return 404; }
    try_files /desktop-update.html =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /console {
    return 301 /console/;
  }

  location /console/ {
    alias /app/dashboard/dist/;
    try_files $uri $uri/ /console/index.html;
  }

  location = /admin {
    return 301 /admin/;
  }

  location = /admin/ {
    root /app/dashboard/dist;
    try_files /admin.html =404;
  }

  location /admin/ {
    alias /app/dashboard/dist/;
    try_files $uri $uri/ /admin.html;
  }

  location = /dashboard {
    return 301 /console/;
  }

  location ~ ^/(?:team-invite|(?:console|dashboard)/team-invite|(?:admin|console|dashboard)/(?:teams|invitations)(?:/.*)?)/?$ {
    return 404;
  }

  location ~ ^/(?:dashboard|console)/(system|users|devices|audit-logs|problem-feedback|backup|logs|webhook-deliveries)/?$ {
    return 301 /admin/$1$is_args$args;
  }

  location ~ ^/(?:dashboard|console)/admin-drive/?$ {
    return 301 /admin/drive$is_args$args;
  }

  location ~ ^/(?:dashboard|console)/skill-repositories/admin/?$ {
    return 301 /admin/skill-repositories$is_args$args;
  }

  location ~ ^/dashboard/(sign-in|sign-up|forgot-password|reset-password|auth/desktop|settings|my-devices|webhooks(?:/.*)?|drive(?:/.*)?|skill-repositories(?:/.*)?|skills(?:/.*)?)/?$ {
    return 301 /console/$1$is_args$args;
  }

  location /dashboard/ {
    return 404;
  }

  location @problem_feedback_too_large {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 400 '{"code":"INVALID_INPUT","data":{"field":"request","reason":"too_large"}}';
  }

  location @problem_feedback_rate_limited {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 429 '{"code":"RATE_LIMITED"}';
  }

  location = /api/problem-feedback {
    if ($request_method != POST) { return 405; }

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    error_page 413 = @problem_feedback_too_large;
    error_page 429 = @problem_feedback_rate_limited;
    limit_req zone=problem_feedback_network burst=2 nodelay;
    limit_req zone=problem_feedback_global burst=29 nodelay;
    limit_req_status 429;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
  }

  location = /api/drive/collaboration {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /webhooks/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /files/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sites/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/drive/items/[^/]+/(download|render)$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/share/[^/]+/(download|render)$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/share/[^/]+/items/[^/]+/(download|render)$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /drive/items/ {
    alias /app/dashboard/dist/;
    try_files $uri $uri/ /console/index.html;
  }

  location = /drive {
    root /app/dashboard/dist;
    try_files /index.html =404;
  }

  location = /drive/ {
    root /app/dashboard/dist;
    try_files /index.html =404;
  }

  location /share/ {
    alias /app/dashboard/dist/;
    try_files $uri $uri/ /console/index.html;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:3001/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 302 /console/;
  }
}
